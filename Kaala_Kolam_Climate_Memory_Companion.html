function heroStrip(){
  const rnd=mulberry(7),n=56,svg=s('svg',{class:'strip',viewBox:'0 0 '+n+' 10',preserveAspectRatio:'none','aria-hidden':'true'});
  for(let i=0;i<n;i++){const v=-1.7+3.4*(i/(n-1))+(rnd()-.5)*1.1;svg.append(s('rect',{x:i,y:0,width:1.02,height:10,fill:scaleColor(v),style:'animation-delay:'+(i*28)+'ms'}));}
  return svg;
}
function kolamSvg(done){
  const n=done.filter(Boolean).length;
  const svg=s('svg',{viewBox:'-112 -112 224 224',class:'kolam',role:'img','aria-label':lang()==='ta'?'காலக்கோலம்: 5 இதழ்களில் '+n+' நிறைவு':'Kolam: '+n+' of 5 petals complete'});
  for(let i=0;i<5;i++)svg.append(s('ellipse',{class:'petal'+(done[i]?' on':''),cx:0,cy:-54,rx:17,ry:40,transform:'rotate('+(i*72)+')'}));
  svg.append(s('circle',{class:'dot',cx:0,cy:0,r:3.4}));
  const pts=[];
  for(let i=0;i<5;i++){
    const a=(i*72-90)*Math.PI/180,b=(i*72-54)*Math.PI/180,c=(i*72-18)*Math.PI/180;
    svg.append(s('circle',{class:done[i]?'dot':'dotf',cx:(22*Math.cos(a)).toFixed(1),cy:(22*Math.sin(a)).toFixed(1),r:2.6}));
    svg.append(s('circle',{class:'dotf',cx:(94*Math.cos(b)).toFixed(1),cy:(94*Math.sin(b)).toFixed(1),r:2.4}));
    pts.push([94*Math.cos(b),94*Math.sin(b),116*Math.cos(c),116*Math.sin(c)]);
  }
  if(n===5){let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);for(let i=0;i<5;i++){const nx=pts[(i+1)%5];d+=' Q'+pts[i][2].toFixed(1)+' '+pts[i][3].toFixed(1)+' '+nx[0].toFixed(1)+' '+nx[1].toFixed(1);}svg.append(s('path',{class:'lace',d}));}
  return svg;
}

function b64d(b){b=b.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return JSON.parse(decodeURIComponent(escape(atob(b))))}
function fnv(str){let x=2166136261;for(let i=0;i<str.length;i++){x^=str.charCodeAt(i);x=Math.imul(x,16777619)}return(x>>>0).toString(16).padStart(8,'0').slice(0,6)}
function mkCode(kind,obj){const b=b64e(obj);return 'K'+kind+'1.'+b+'.'+fnv(b)}
function ivRecord(iv){return{t:'I',i:iv.id,p:iv.place,b:iv.dec,a:Q.map(q=>{const x=iv.a[q.id];return x&&x.r!=null?x.r+3:0}).join('')}}

function importCodes(text){
  const found=String(text).match(/K[KP]1\.[A-Za-z0-9_-]+\.[0-9a-f]{6}/g)||[];
  let added=0,dup=0,bad=0;
  const ids=new Set([...S.pool.imports.map(r=>r.i),...S.pool.plans.map(r=>r.i)]);
  found.forEach(code=>{
    try{
      const [pre,b,chk]=code.split('.');if(fnv(b)!==chk)throw 0;
      const o=b64d(b);if(typeof o.i!=='string'||o.i.length>12)throw 0;
      if(ids.has(o.i)){dup++;return}
      if(pre==='KK1'&&o.t==='I'){
        if(!(Number.isInteger(o.p)&&o.p>=0&&o.p<5&&Number.isInteger(o.b)&&o.b>=0&&o.b<6&&typeof o.a==='string'&&o.a.length===Q.length&&/^[0-5]+$/.test(o.a)))throw 0;
        S.pool.imports.push({t:'I',i:o.i,p:o.p,b:o.b,a:o.a});
      }else if(pre==='KP1'&&o.t==='P'){
        if(!(Number.isInteger(o.s)&&o.s>=0&&o.s<3&&Array.isArray(o.o)&&o.o.length<=OPT.length&&o.o.every(k=>Number.isInteger(k)&&k>=0&&k<OPT.length)))throw 0;
        S.pool.plans.push({t:'P',i:o.i,s:o.s,o:o.o});
      }else throw 0;
      ids.add(o.i);added++;
    }catch(e){bad++}
  });
  if(added)S.flags.pool=true;
  save();return{added,dup,bad,found:found.length};
}

function riskFor(picks,scn){
  let gm=SCN[scn].m,lh=0;const g={};GR.forEach(x=>g[x.id]={E:x.E,V:x.V});
  picks.forEach(id=>{const o=OPT.find(z=>z.id===id);if(!o)return;o.g.forEach(k=>{g[k].E=Math.max(1,g[k].E-(o.E||0));g[k].V=Math.max(1,g[k].V-(o.V||0))});lh+=o.lh||0;gm-=o.gm||0});
  const H=Math.min(10,5*gm*(1-Math.min(lh,.3)));const r={};let tot=0;
  GR.forEach(x=>{r[x.id]=H*g[x.id].E*g[x.id].V/10;tot+=r[x.id]});
  return{H,r,mean:tot/GR.length};
}

{id:'sun',cat:'sky',ic:'sun',t:{en:'Sun, seasons and why places differ',ta:'சூரியன், பருவங்கள், இடங்கள் ஏன் வேறுபடுகின்றன'},
 k:{en:'The Sun warms the Earth, but not evenly. Places where sunlight falls straight down get hotter, like a torch pointed straight at a wall.',ta:'சூரியன் பூமியை வெப்பப்படுத்துகிறது, ஆனால் எல்லா இடங்களிலும் சமமாக இல்லை. சூரிய ஒளி நேராக விழும் இடங்கள் அதிகம் சூடாகின்றன; சுவரில் நேராக அடிக்கும் டார்ச் வெளிச்சம் போல.'},
 tr:{en:'Shine a torch straight onto paper, then at a slant. Where is the light brighter and more tightly packed?',ta:'ஒரு தாளில் டார்ச்சை நேராகவும் சாய்வாகவும் அடித்துப் பார். எங்கே வெளிச்சம் அதிகமாகவும் செறிவாகவும் உள்ளது?'},
 a:{en:'Earth is tilted. As it circles the Sun, different places face the Sun more directly at different times of year, and that creates the seasons. Near the equator sunlight is strong all year, so the main seasonal change is rain, not temperature. Farther from the equator, summers and winters differ strongly. India’s weather department describes four seasons: winter, pre-monsoon summer, the south-west monsoon, and the post-monsoon months.',ta:'பூமி சாய்வாக உள்ளது. சூரியனைச் சுற்றும்போது ஆண்டின் வெவ்வேறு காலங்களில் வெவ்வேறு இடங்களில் சூரிய ஒளி நேராகவோ சாய்வாகவோ விழுகிறது; இதனால் பருவங்கள் உண்டாகின்றன. நிலநடுக்கோட்டுக்கு அருகில் ஆண்டு முழுவதும் சூரிய ஒளி வலுவாக இருப்பதால் முக்கிய பருவ மாற்றம் மழையே, வெப்பநிலை அல்ல. தொலைவில் உள்ள இடங்களில் கோடையும் குளிர்காலமும் மிகவும் வேறுபடும். இந்திய வானிலைத் துறை குளிர்காலம், கோடைக்காலம், தென்மேற்குப் பருவமழை, பருவமழைக்குப் பிந்தைய மாதங்கள் என நான்கு பருவங்களை வகுக்கிறது.'},
 d:'The energy received per unit area depends on the angle of the Sun’s rays. Earth’s axial tilt of about 23.4° drives the seasons. The orbit is slightly elliptical, but distance from the Sun is not the cause of seasons. Land and ocean respond differently because water has a very high heat capacity.'},
{id:'water',cat:'sky',ic:'water',demo:'water',t:{en:'The water cycle',ta:'நீர் சுழற்சி'},
 k:{en:'Water never gets lost. The Sun heats the sea and puddles, water rises as invisible vapour, makes clouds, and falls back as rain. Round and round it goes!',ta:'தண்ணீர் ஒருபோதும் தொலைவதில்லை. சூரியன் கடலையும் குட்டையையும் சூடாக்க, நீர் கண்ணுக்குத் தெரியாத நீராவியாக மேலே செல்கிறது; மேகமாகி மழையாகத் திரும்பி வருகிறது. இது சுற்றிச் சுற்றி நடக்கிறது!'},
 tr:{en:'Put a wet cloth in the sun. Soon it is dry. Where did the water go?',ta:'ஈரத் துணியை வெயிலில் போடு. சீக்கிரம் காயும். தண்ணீர் எங்கே போனது?'},
 a:{en:'Heat from the Sun evaporates water from oceans, lakes, soil and plants. The vapour rises, cools and condenses into cloud droplets. When droplets grow large enough they fall as rain, hail or snow, then run into rivers, soak into the ground or evaporate again. Warmer air can hold more water vapour, which is one reason heavy rain becomes more intense in a warming world.',ta:'கடல், ஏரி, மண், தாவரங்களிலிருந்து சூரியனின் வெப்பம் நீரை ஆவியாக்குகிறது. ஆவி மேலே சென்று குளிர்ந்து மேகத் துளிகளாகிறது. துளிகள் போதிய அளவு பெரியதானதும் மழையாக விழுகின்றன; பின்னர் ஆறுகளில் ஓடுகின்றன, நிலத்தில் ஊறுகின்றன, அல்லது மீண்டும் ஆவியாகின்றன. வெப்பமான காற்று அதிக நீராவியைத் தாங்கும்; அதனால் வெப்பமாகும் உலகில் கனமழை மேலும் தீவிரமாகிறது.'},
 d:'Evaporation, transpiration, condensation, precipitation and runoff cycle roughly 500,000 km³ of water through the atmosphere each year. Latent heat released by condensation powers storms. Water-holding capacity of air rises about 7% per °C (Clausius–Clapeyron relation).'},
{id:'cloud',cat:'sky',ic:'cloud',t:{en:'Clouds and rain',ta:'மேகங்களும் மழையும்'},
 k:{en:'Clouds are not cotton. They are made of tiny water drops or ice crystals. When the drops bump together and grow heavy, they fall as rain.',ta:'மேகங்கள் பஞ்சால் ஆனவை அல்ல; சிறு நீர்த் துளிகளாலும் பனிக்கட்டிப் படிகங்களாலும் ஆனவை. துளிகள் ஒன்றோடொன்று மோதிப் பெரிதாகிக் கனத்தால் மழையாக விழுகின்றன.'},
 tr:{en:'Look at the clouds today. Are they flat, fluffy or tall? Draw one.',ta:'இன்று மேகங்களைப் பார். தட்டையா, பஞ்சு போலவா, உயரமா? ஒன்றை வரை.'},
 a:{en:'Air cools as it rises, and cool air holds less vapour. Vapour condenses onto tiny particles such as dust and sea salt, forming cloud. Air is pushed upward by heating, by hills, or where cool and warm air meet. Tall, dark cumulonimbus clouds bring thunderstorms; thin, high clouds usually bring no rain.',ta:'மேலே செல்லும் காற்று குளிர்கிறது; குளிர்ந்த காற்று குறைவான நீராவியையே தாங்கும். தூசு, கடல் உப்பு போன்ற நுண்துகள்களின் மேல் ஆவி நீர்த்துளிகளாகி மேகம் உண்டாகிறது. வெப்பம், மலைகள், குளிர்ந்த மற்றும் சூடான காற்று சந்திக்கும் இடம் ஆகியவை காற்றை மேலே தள்ளுகின்றன. உயரமான கருமேகங்கள் (கியூமுலோநிம்பஸ்) இடி மழை தரும்; மெல்லிய உயர மேகங்கள் பொதுவாக மழை தராது.'},
 d:'Cloud droplets of about 10 µm grow by condensation and by collision and coalescence. In colder clouds the ice-crystal (Bergeron) process matters. Aerosols act as cloud condensation nuclei and influence droplet size.'},
{id:'wind',cat:'sky',ic:'wind',t:{en:'Wind',ta:'காற்று'},
 k:{en:'Warm air is light and floats up. Cooler air rushes in to fill the space. That rush is wind.',ta:'சூடான காற்று இலேசாகி மேலே எழுகிறது. குளிர்ந்த காற்று அந்த இடத்தை நிரப்ப விரைந்து வருகிறது. அந்த விரைவே காற்று.'},
 tr:{en:'Hold up a light feather and watch which way it drifts. Where is the wind coming from?',ta:'ஒரு இறகை உயரே பிடித்து எந்தப் பக்கம் செல்கிறது என்று பார். காற்று எங்கிருந்து வருகிறது?'},
 a:{en:'Wind blows from high-pressure areas towards low-pressure areas. Uneven heating of land, sea and air creates these pressure differences. Earth’s rotation bends the path of large winds, which is why cyclones spin. Wind direction is named by where it comes from: a north-east wind blows from the north-east.',ta:'அதிக அழுத்தப் பகுதியிலிருந்து குறைந்த அழுத்தப் பகுதியை நோக்கிக் காற்று வீசுகிறது. நிலம், கடல், காற்று சமமின்றி வெப்பமடைவதால் இந்த அழுத்த வேறுபாடுகள் உண்டாகின்றன. பூமியின் சுழற்சி பெரிய காற்றுகளின் பாதையை வளைக்கிறது; அதனால்தான் புயல்கள் சுழல்கின்றன. காற்றின் திசை அது வரும் இடத்தால் குறிக்கப்படும்: வடகிழக்குக் காற்று வடகிழக்கிலிருந்து வீசும்.'},
 d:'Away from the equator, large-scale flow is close to geostrophic balance between the pressure-gradient and Coriolis forces. Near the equator the Coriolis effect is weak, which is why tropical cyclones rarely form within about 5° of it.'},
{id:'humid',cat:'sky',ic:'humid',t:{en:'Humidity and sticky heat',ta:'ஈரப்பதமும் புழுக்கமும்'},
 k:{en:'Air always holds some invisible water. When there is a lot, our sweat cannot dry, so we feel sticky and hot.',ta:'காற்றில் எப்போதும் கண்ணுக்குத் தெரியாத சிறிது நீர் இருக்கும். அது அதிகமானால் நம் வியர்வை காயாது; அதனால் புழுக்கமாகவும் சூடாகவும் உணர்கிறோம்.'},
 tr:{en:'Breathe onto a cold glass or mirror. What do you see appear? Where did it come from?',ta:'குளிர்ந்த கண்ணாடியின் மேல் ஊது. என்ன தோன்றுகிறது? அது எங்கிருந்து வந்தது?'},
 a:{en:'Humidity is the amount of water vapour in the air. Sweating cools us only when it can evaporate. In humid air evaporation slows, so the same temperature feels hotter. That is why coastal towns can feel more oppressive than dry places at the same thermometer reading, and why “feels-like” or heat-index values matter.',ta:'ஈரப்பதம் என்பது காற்றில் உள்ள நீராவியின் அளவு. வியர்வை ஆவியாகும்போதுதான் நம்மைக் குளிர்விக்கிறது. ஈரப்பதம் அதிகமான காற்றில் ஆவியாதல் மெதுவாகும்; அதனால் அதே வெப்பநிலையும் அதிகச் சூடாக உணரப்படும். அதனால்தான் கடலோர ஊர்கள் வறண்ட இடங்களைவிட அதே வெப்பமானி அளவில் அதிகப் புழுக்கமாக இருக்கும்; “உணரும் வெப்பம்” அல்லது வெப்பக் குறியீடு முக்கியம்.'},
 d:'Relative humidity depends on temperature, so dew point or wet-bulb temperature is a better guide to heat stress. A wet-bulb temperature of 35 °C was long cited as the theoretical limit of human survival, and newer experiments suggest harm begins at lower values, especially for older people.'},
{id:'storm',cat:'sky',ic:'bolt',t:{en:'Thunderstorms and lightning',ta:'இடி மழையும் மின்னலும்'},
 k:{en:'Inside a storm cloud, ice and water bump and build up electricity. Lightning is a giant spark. Thunder is the loud boom the spark makes in the air.',ta:'புயல் மேகத்துக்குள் பனியும் நீரும் மோதி மின்சாரம் சேர்கிறது. மின்னல் ஒரு பெரிய தீப்பொறி. அந்தப் பொறி காற்றில் உண்டாக்கும் பெரும் ஒலியே இடி.'},
 tr:{en:'See the flash, then count the seconds until the boom. Every 3 seconds is about 1 kilometre away.',ta:'மின்னலைப் பார்த்த பின் இடி கேட்கும் வரை வினாடிகளை எண்ணு. ஒவ்வொரு 3 வினாடியும் சுமார் 1 கி.மீ தூரம்.'},
 a:{en:'Strong heating lifts warm, moist air quickly to great heights and builds towering clouds. Electric charge separates inside the cloud and discharges as lightning. The flash heats the air so fast that it booms as thunder. Lightning causes many deaths in India every year, mostly among farmers and outdoor workers, so knowing what to do matters.',ta:'வலுவான வெப்பம் சூடான ஈரக்காற்றை விரைவாக உயரத்துக்குத் தூக்கி, வானுயர மேகங்களை உருவாக்குகிறது. மேகத்துக்குள் மின்னூட்டம் பிரிந்து மின்னலாக வெளியேறுகிறது. மின்னல் காற்றை மிக வேகமாகச் சூடாக்குவதால் இடியாக முழங்குகிறது. இந்தியாவில் ஆண்டுதோறும் பலர் மின்னலால் இறக்கின்றனர்; பெரும்பாலும் விவசாயிகளும் வெளியில் வேலை செய்வோரும். எனவே என்ன செய்ய வேண்டும் என்று அறிவது முக்கியம்.'},
 do:{en:['Go indoors or into a hard-roofed vehicle. A tree is not shelter.','Stay away from open fields, water, poles and metal fences.','If you cannot reach shelter, crouch low on the balls of your feet with your feet together. Do not lie flat.','Wait 30 minutes after the last thunder before going out.','Use official lightning alerts if your area has them.'],ta:['வீட்டுக்குள் அல்லது கடினக் கூரை உள்ள வாகனத்துக்குள் செல்லுங்கள். மரம் பாதுகாப்பான இடம் அல்ல.','திறந்த வயல், நீர், மின்கம்பம், உலோக வேலி ஆகியவற்றிலிருந்து விலகி இருங்கள்.','தங்குமிடம் கிடைக்கவில்லை என்றால், கால்களை ஒன்றாக வைத்து, பாதங்களின் முன்பகுதியில் தாழ்வாகக் குனிந்து அமருங்கள். படுக்க வேண்டாம்.','கடைசி இடிக்குப் பிறகு 30 நிமிடம் காத்திருந்து வெளியே செல்லுங்கள்.','உங்கள் பகுதியில் இருந்தால் அதிகாரப்பூர்வ மின்னல் எச்சரிக்கைகளைப் பயன்படுத்துங்கள்.']},
 d:'Charge separation involves collisions between graupel and ice crystals in the mixed-phase region of the cloud. A flash briefly heats the air to around 30,000 K. The 30-minute rule exists because lightning can strike well away from the rain core.'},
{id:'breeze',cat:'sky',ic:'breeze',demo:'breeze',t:{en:'Sea breeze, land breeze and the idea behind the monsoon',ta:'கடற்காற்று, நிலக்காற்று, பருவக்காற்றின் அடிப்படை'},
 k:{en:'In the day, land heats faster than the sea. Warm air rises over the land and cool sea air blows in. At night, it goes the other way.',ta:'பகலில் நிலம் கடலைவிட வேகமாகச் சூடாகிறது. நிலத்தின் மேல் சூடான காற்று எழ, கடலின் குளிர்ந்த காற்று உள்ளே வீசுகிறது. இரவில் இது எதிர்த்திசையில் நடக்கும்.'},
 a:{en:'Water takes much longer to heat up and cool down than land. By day the land warms, air rises, and a cool sea breeze comes ashore. By night the land cools faster and a land breeze flows out to sea. The monsoon is the same idea on a huge scale: it follows the seasons instead of the hours.',ta:'நிலத்தைவிட நீர் சூடாகவும் குளிரவும் மிக அதிக நேரம் எடுக்கும். பகலில் நிலம் சூடாகி, காற்று எழுந்து, குளிர்ந்த கடற்காற்று கரைக்கு வருகிறது. இரவில் நிலம் வேகமாகக் குளிர்ந்து, நிலக்காற்று கடலை நோக்கிச் செல்கிறது. பருவக்காற்றும் இதே கருத்துதான், பெரிய அளவில்: அது மணிநேரங்களுக்கு அல்ல, பருவங்களுக்கு ஏற்ப மாறுகிறது.'},
 d:'Water’s specific heat is about four times that of dry soil, and mixing in the upper ocean spreads heat through a deep layer. Sea-breeze fronts can trigger afternoon thunderstorms inland.'},
{id:'monsoon',cat:'big',ic:'monsoon',t:{en:'The monsoon',ta:'பருவமழை'},
 k:{en:'Monsoon winds change direction with the seasons. In summer, wet winds from the sea bring rain to most of India. From October to December, winds from the north-east bring rain to Tamil Nadu.',ta:'பருவக்காற்றுகள் பருவத்துக்கு ஏற்ப திசை மாறுகின்றன. கோடையில் கடலிலிருந்து வரும் ஈரக்காற்று இந்தியாவின் பெரும்பகுதிக்கு மழை தருகிறது. அக்டோபர் முதல் டிசம்பர் வரை வடகிழக்கிலிருந்து வரும் காற்று தமிழ்நாட்டுக்கு மழை தருகிறது.'},
 a:{en:'In summer the land warms more than the ocean, so moist air flows from the Indian Ocean towards land. This south-west monsoon (June to September) brings most of India’s yearly rain, but much of Tamil Nadu lies in the rain shadow of the Western Ghats. Tamil Nadu gets most of its rain from the north-east monsoon (October to December), when winds gather moisture over the Bay of Bengal. Kanyakumari district usually receives rain from both. Monsoon rain arrives in active spells and breaks, so a good season overall can still hold floods and dry weeks.',ta:'கோடையில் நிலம் கடலைவிட அதிகம் சூடாவதால் இந்தியப் பெருங்கடலிலிருந்து ஈரக்காற்று நிலத்தை நோக்கி வீசுகிறது. இந்தத் தென்மேற்குப் பருவமழை (ஜூன் முதல் செப்டம்பர் வரை) இந்தியாவின் ஆண்டு மழையில் பெரும்பகுதியைத் தருகிறது; ஆனால் தமிழ்நாட்டின் பெரும்பகுதி மேற்குத் தொடர்ச்சி மலையின் மழை மறைவுப் பகுதியில் உள்ளது. வங்காள விரிகுடாவில் ஈரப்பதம் சேர்க்கும் வடகிழக்குப் பருவமழையே (அக்டோபர் முதல் டிசம்பர் வரை) தமிழ்நாட்டுக்கு பெரும்பாலான மழையைத் தருகிறது. கன்னியாகுமரி மாவட்டம் பொதுவாக இரண்டிலிருந்தும் மழை பெறுகிறது. பருவமழை தீவிர காலங்களாகவும் இடைவெளிகளாகவும் வருவதால், மொத்தத்தில் நல்ல பருவத்திலும் வெள்ளமும் வறண்ட வாரங்களும் இருக்கலாம்.'},
 d:'The monsoon is a seasonal reversal of low-level winds linked to the northward movement of the tropical rain belt (ITCZ), land–sea thermal contrast and heating of the Tibetan Plateau. Year-to-year variation is influenced by ENSO and the Indian Ocean Dipole. Observed trends include weaker June–September totals over parts of India and more frequent extreme-rain events.'},
{id:'cyclone',cat:'big',ic:'cyclone',t:{en:'Cyclones',ta:'புயல்'},
 k:{en:'A cyclone is a giant spinning storm that grows over warm sea water. It brings strong winds and heavy rain. When officials say go to a shelter, we go.',ta:'புயல் என்பது வெப்பமான கடல் நீரின் மேல் வளரும் பெரிய சுழலும் புயல். அது வலுவான காற்றையும் கனமழையையும் தருகிறது. அதிகாரிகள் காப்பகத்துக்குச் செல்லச் சொன்னால் செல்ல வேண்டும்.'},
 a:{en:'Tropical cyclones form over seas warmer than about 26 to 27 °C, where warm moist air rises and Earth’s spin makes the storm rotate. Wind, heavy rain and a rise in sea level called storm surge together cause the damage. Surge is often the deadliest part near the coast. Over the North Indian Ocean cyclones peak around April to June and October to December. Warnings come days ahead, so early action saves lives.',ta:'26–27 °C-க்கு மேல் வெப்பமுள்ள கடலில், சூடான ஈரக்காற்று எழுந்து, பூமியின் சுழற்சியால் புயல் சுழலத் தொடங்குகிறது. காற்று, கனமழை, புயல் கடல் எழுச்சி எனப்படும் கடல்மட்ட உயர்வு ஆகிய மூன்றும் சேர்ந்து சேதம் செய்கின்றன. கரைக்கு அருகில் இந்த எழுச்சியே பெரும்பாலும் மிகுந்த உயிர்ச்சேதம் தருகிறது. வட இந்தியப் பெருங்கடலில் புயல்கள் ஏப்ரல்–ஜூன், அக்டோபர்–டிசம்பர் காலங்களில் அதிகம் வருகின்றன. எச்சரிக்கை நாட்களுக்கு முன்பே வருவதால் உடனே செயல்படுவது உயிர் காக்கும்.'},
 do:{en:['Follow IMD and state government warnings. Leave when told.','Keep a ready bag: documents, medicines, torch, power bank, water, dry food.','Fishers: do not go to sea during warnings. Move boats and nets to safety.','Stay away from the coast and windows. Shelter in a strong building.','Do not go out in the calm of the eye. The wind returns from the other side.'],ta:['இந்திய வானிலைத் துறை, மாநில அரசின் எச்சரிக்கைகளைப் பின்பற்றுங்கள். சொன்னால் வெளியேறுங்கள்.','தயாராக ஒரு பை வையுங்கள்: ஆவணங்கள், மருந்துகள், டார்ச், மின்கல ஆற்றல் சேமிப்பி, தண்ணீர், உலர் உணவு.','மீனவர்கள்: எச்சரிக்கையின்போது கடலுக்குச் செல்ல வேண்டாம். படகுகளையும் வலைகளையும் பாதுகாப்பான இடத்துக்கு மாற்றுங்கள்.','கடற்கரை, ஜன்னல்களிலிருந்து விலகி இருங்கள். உறுதியான கட்டிடத்தில் தங்குங்கள்.','புயலின் கண் பகுதியின் அமைதியில் வெளியே செல்ல வேண்டாம். காற்று மறுபக்கத்திலிருந்து திரும்ப வரும்.']},
 d:'Intensity depends on sea-surface temperature, ocean heat content, low vertical wind shear and mid-level moisture. IMD classes by maximum sustained wind: depression 17–27 knots, deep depression 28–33, cyclonic storm 34–47, severe cyclonic storm 48–63, very severe 64–89, extremely severe 90–119, super cyclonic storm 120 knots or more.'},
{id:'enso',cat:'big',ic:'enso',t:{en:'El Niño and La Niña',ta:'எல் நினோ, லா நினா'},
 k:{en:'Every few years the warm water of the Pacific Ocean sloshes east (El Niño) or gets pushed west (La Niña). This changes rain and heat in faraway places, including India.',ta:'சில ஆண்டுகளுக்கு ஒருமுறை பசிபிக் பெருங்கடலின் சூடான நீர் கிழக்கே நகர்கிறது (எல் நினோ) அல்லது மேற்கே தள்ளப்படுகிறது (லா நினா). இது இந்தியா உட்பட தொலைதூர இடங்களின் மழையையும் வெப்பத்தையும் மாற்றுகிறது.'},
 a:{en:'El Niño and La Niña are natural swings in the tropical Pacific, linked to changes in the trade winds. They shift rainfall and temperature around the world. Their effect on India differs each time because other influences, such as the Indian Ocean, also matter. El Niño does not always mean drought. Over Tamil Nadu the north-east monsoon has tended to be wetter in El Niño years, though that is not guaranteed. Always follow official seasonal outlooks.',ta:'எல் நினோ, லா நினா ஆகியவை வெப்பமண்டலப் பசிபிக்கில் ஏற்படும் இயற்கையான ஏற்ற இறக்கங்கள்; வாணிபக் காற்றுகளின் மாற்றத்துடன் தொடர்புடையவை. அவை உலகெங்கும் மழையையும் வெப்பத்தையும் மாற்றுகின்றன. இந்தியப் பெருங்கடல் போன்ற பிற காரணிகளும் முக்கியம் என்பதால், இந்தியாவில் அவற்றின் விளைவு ஒவ்வொரு முறையும் வேறுபடும். எல் நினோ என்றால் எப்போதும் வறட்சி அல்ல. தமிழ்நாட்டில் எல் நினோ ஆண்டுகளில் வடகிழக்குப் பருவமழை அதிகமாக இருக்கும் போக்கு இருந்துள்ளது; ஆனால் அது உறுதி அல்ல. அதிகாரப்பூர்வ பருவ முன்னறிவிப்புகளையே பின்பற்றுங்கள்.'},
 d:'ENSO is tracked with the Oceanic Niño Index, a three-month mean sea-surface temperature anomaly in the Niño 3.4 region, with thresholds of ±0.5 °C. The Indian Ocean Dipole can strengthen or offset ENSO’s influence on Indian rainfall.'},
{id:'heat',cat:'haz',ic:'heat',t:{en:'Heatwaves',ta:'வெப்ப அலை'},
 k:{en:'A heatwave is many days of unusually hot weather. Heat can make people very sick. Drink water, rest in shade, and check on grandparents.',ta:'வெப்ப அலை என்பது பல நாட்கள் வழக்கத்துக்கு மாறாக மிகுந்த வெப்பம் நிலவுவது. வெப்பம் மக்களை மிகவும் நோயுறச் செய்யும். தண்ணீர் குடியுங்கள், நிழலில் ஓய்வெடுங்கள், தாத்தா பாட்டியைக் கவனியுங்கள்.'},
 a:{en:'India’s weather department declares a heatwave in the plains when the maximum temperature reaches 40 °C and is at least 4.5 °C above normal. For coastal areas the mark is 37 °C. Heat is most dangerous for the elderly, babies, outdoor workers, people with heart or kidney illness, and anyone with no cooling at night. Hot nights stop the body from recovering, and humidity makes heat more dangerous. Heatwaves are becoming more frequent and intense as the climate warms.',ta:'சமவெளிப் பகுதிகளில் அதிகபட்ச வெப்பநிலை 40 °C-ஐ எட்டி, இயல்பைவிடக் குறைந்தது 4.5 °C அதிகமாக இருந்தால் இந்திய வானிலைத் துறை அதை வெப்ப அலை என அறிவிக்கும்; கடலோரப் பகுதிகளுக்கு இது 37 °C. முதியோர், குழந்தைகள், வெளியில் வேலை செய்வோர், இதயம், சிறுநீரக நோய் உள்ளவர்கள், இரவிலும் குளிர்ச்சி இல்லாதவர்கள் ஆகியோருக்கு வெப்பம் மிகவும் ஆபத்தானது. சூடான இரவுகள் உடல் மீளவிடாது; ஈரப்பதம் வெப்பத்தை இன்னும் ஆபத்தாக்கும். காலநிலை வெப்பமடையும்போது வெப்ப அலைகள் அடிக்கடியும் தீவிரமாகவும் வருகின்றன.'},
 do:{en:['Drink water often, even if you are not thirsty. Buttermilk, rice kanji and oral rehydration salts help. If a doctor has limited your fluids, ask first.','Avoid going out from noon to 3 pm. Cover your head and wear light cotton clothes.','Never leave a child or an elder in a closed vehicle or a closed hot room.','Heat stroke signs: very hot skin, confusion, fainting, sometimes no sweating. Move the person to shade, cool them with wet cloth, and call 108 or 112 at once.','Check on elderly neighbours twice a day.'],ta:['தாகம் இல்லாவிட்டாலும் அடிக்கடி தண்ணீர் குடியுங்கள். மோர், கஞ்சி, உப்பு–சர்க்கரை நீர் உதவும். மருத்துவர் திரவத்தைக் கட்டுப்படுத்தியிருந்தால் முதலில் கேளுங்கள்.','பகல் 12 முதல் 3 மணி வரை வெளியே செல்வதைத் தவிருங்கள். தலையை மூடி, இலகுவான பருத்தி ஆடை அணியுங்கள்.','குழந்தையையோ முதியவரையோ மூடிய வாகனத்திலோ மூடிய சூடான அறையிலோ ஒருபோதும் தனியாக விடாதீர்கள்.','வெப்பத் தாக்குதல் அறிகுறிகள்: மிகவும் சூடான தோல், குழப்பம், மயக்கம், சிலசமயம் வியர்வை நின்றுவிடுதல். அவரை நிழலுக்குக் கொண்டு சென்று ஈரத்துணியால் குளிர்வித்து, உடனே 108 அல்லது 112-ஐ அழையுங்கள்.','வயதான அண்டை வீட்டாரை நாளுக்கு இருமுறை சென்று பாருங்கள்.']},
 d:'IMD heatwave departures are 4.5–6.4 °C above normal, and severe heatwave is more than 6.4 °C above normal. Absolute thresholds also apply, for example 45 °C or more. Heat illness risk depends on temperature, humidity, radiation, wind and individual health, so thresholds are guides rather than guarantees.'},
{id:'flood',cat:'haz',ic:'flood',t:{en:'Floods',ta:'வெள்ளம்'},
 k:{en:'A flood is when water covers land that is usually dry. It can come from very heavy rain, an overflowing river or blocked drains. Never play in flood water.',ta:'வெள்ளம் என்பது வழக்கமாக வறண்டிருக்கும் நிலத்தை நீர் மூடுவது. மிகக் கனமழை, ஆறு பெருக்கெடுப்பது, வடிகால் அடைப்பு ஆகியவற்றால் வரலாம். வெள்ள நீரில் ஒருபோதும் விளையாடாதீர்கள்.'},
 a:{en:'Floods can be river floods, flash floods from sudden downpours, or coastal floods when the sea rises. How bad a flood is depends on the rain and also on drains, wetlands, buildings and warning systems. Filling lakes and wetlands and blocking drains makes the same rain far more harmful. Floodwater can carry disease, sewage and live electricity.',ta:'வெள்ளம் ஆற்று வெள்ளமாகவோ, திடீர்ப் பெருமழையால் வரும் திடீர் வெள்ளமாகவோ, கடல் உயரும்போது வரும் கடலோர வெள்ளமாகவோ இருக்கலாம். வெள்ளம் எவ்வளவு மோசமாகும் என்பது மழையை மட்டுமல்ல, வடிகால், ஈரநிலங்கள், கட்டடங்கள், எச்சரிக்கை அமைப்புகளையும் சார்ந்தது. ஏரிகளையும் ஈரநிலங்களையும் நிரப்பி வடிகால்களை அடைத்தால் அதே மழை மிகுந்த தீங்கு செய்யும். வெள்ள நீர் நோய், கழிவுநீர், மின்சாரம் ஆகியவற்றைக் கொண்டு வரலாம்.'},
 do:{en:['Move to higher ground early. Do not wait for water to enter the house.','Never walk or drive through moving water. 15 cm can knock an adult down and 60 cm can carry away most vehicles.','Switch off the main electricity if water is rising indoors.','Afterwards drink only boiled or chlorinated water, and avoid wading barefoot.','Keep documents and medicines in a waterproof bag.'],ta:['முன்கூட்டியே உயரமான இடத்துக்குச் செல்லுங்கள். வீட்டுக்குள் நீர் வரும் வரை காத்திருக்காதீர்கள்.','ஓடும் நீரில் நடக்கவோ வாகனம் ஓட்டவோ வேண்டாம். 15 செ.மீ நீர் பெரியவரை வீழ்த்தலாம்; 60 செ.மீ நீர் பெரும்பாலான வாகனங்களை அடித்துச் செல்லலாம்.','வீட்டுக்குள் நீர் உயர்ந்தால் மெயின் மின் இணைப்பை அணைத்து விடுங்கள்.','பின்னர் கொதிக்க வைத்த அல்லது குளோரின் சேர்த்த நீரையே குடியுங்கள்; வெறுங்காலுடன் நீரில் நடக்காதீர்கள்.','ஆவணங்களையும் மருந்துகளையும் நீர் புகாத பையில் வையுங்கள்.']},
 d:'Risk is commonly framed as hazard × exposure × vulnerability. Urban flooding is driven by short, intense rainfall that exceeds drainage capacity, by sealed surfaces, and by lost natural storage in wetlands and tanks.'},
{id:'drought',cat:'haz',ic:'drought',t:{en:'Drought',ta:'வறட்சி'},
 k:{en:'A drought is when there is much less water than usual for a long time. Plants dry out and wells run low. Saving water helps everyone.',ta:'வறட்சி என்பது நீண்ட காலம் வழக்கத்தைவிட மிகக் குறைவான நீர் இருப்பது. செடிகள் காய்கின்றன, கிணறுகள் வற்றுகின்றன. தண்ணீரைச் சேமிப்பது எல்லோருக்கும் உதவும்.'},
 a:{en:'Drought has several kinds: meteorological (little rain), agricultural (soil too dry for crops) and hydrological (low rivers, tanks and groundwater). It builds slowly, so it is easy to miss. Over-pumping groundwater can cause a water crisis even in a year of normal rain. Higher temperatures increase evaporation, so a dry spell can become more severe.',ta:'வறட்சியில் பல வகைகள் உள்ளன: வானிலை வறட்சி (குறைந்த மழை), வேளாண் வறட்சி (பயிர்களுக்கு மண் மிகவும் வறண்டது), நீரியல் வறட்சி (ஆறு, ஏரி, நிலத்தடி நீர் குறைவு). இது மெதுவாக உருவாவதால் கவனிக்காமல் விடுவது எளிது. நிலத்தடி நீரை அளவுக்கு மீறி இறைத்தால் சாதாரண மழை ஆண்டிலும் தண்ணீர் நெருக்கடி வரலாம். வெப்பம் உயர்ந்தால் ஆவியாதல் கூடுவதால் வறண்ட காலம் மேலும் கடுமையாகலாம்.'},
 do:{en:['Fix leaks and reuse water for plants.','Harvest rainwater and keep local tanks and ponds desilted.','Farmers: follow local advisories on short-duration crops and drip irrigation.','Keep enough water for drinking and for animals first.'],ta:['கசிவுகளைச் சரிசெய்து, பயன்படுத்திய நீரைச் செடிகளுக்கு மீண்டும் பயன்படுத்துங்கள்.','மழைநீரைச் சேகரியுங்கள்; உள்ளூர் குளங்களையும் ஏரிகளையும் தூர்வாருங்கள்.','விவசாயிகள்: குறுகியகாலப் பயிர்கள், சொட்டு நீர்ப்பாசனம் பற்றிய உள்ளூர் ஆலோசனைகளைப் பின்பற்றுங்கள்.','குடிநீருக்கும் கால்நடைகளுக்கும் போதுமான நீரை முதலில் ஒதுக்குங்கள்.']},
 d:'Indices such as SPI (precipitation), SPEI (which includes evapotranspiration) and soil-moisture anomalies track drought. Meteorological drought in India is typically flagged when seasonal rainfall is more than 25% below normal.'},
{id:'surge',cat:'haz',ic:'tsunami',t:{en:'Storm surge and tsunami are not the same',ta:'புயல் கடல் எழுச்சியும் சுனாமியும் ஒன்றல்ல'},
 k:{en:'A tsunami is made by an earthquake under the sea. A storm surge is made by a cyclone pushing the sea onto the land. Both are dangerous, but they are different.',ta:'சுனாமி கடலுக்கடியில் ஏற்படும் நிலநடுக்கத்தால் உண்டாகிறது. புயல் கடல் எழுச்சி புயல் கடலை நிலத்தின் மேல் தள்ளுவதால் உண்டாகிறது. இரண்டும் ஆபத்தானவை; ஆனால் வேறுபட்டவை.'},
 a:{en:'Storm surge is a rise in sea level caused by cyclone winds and low pressure. It is a weather hazard and can be forecast days ahead. A tsunami is a series of long waves caused by earthquakes, landslides or volcanoes under the sea. It is not caused by weather or climate, and the 2004 Indian Ocean tsunami was an earthquake event. Rising sea level from climate change makes any coastal flooding reach farther.',ta:'புயல் கடல் எழுச்சி என்பது புயல் காற்றாலும் குறைந்த அழுத்தத்தாலும் கடல்மட்டம் உயர்வது. இது ஒரு வானிலை இடர்; நாட்களுக்கு முன்பே முன்னறிவிக்க முடியும். சுனாமி என்பது கடலுக்கடியில் நிலநடுக்கம், நிலச்சரிவு, எரிமலை ஆகியவற்றால் உண்டாகும் தொடர் நீண்ட அலைகள். இது வானிலையாலோ காலநிலையாலோ வருவதல்ல; 2004 இந்தியப் பெருங்கடல் சுனாமி ஒரு நிலநடுக்க நிகழ்வு. காலநிலை மாற்றத்தால் கடல்மட்டம் உயர்வது எந்தக் கடலோர வெள்ளத்தையும் மேலும் தொலைவுக்குக் கொண்டு செல்கிறது.'},
 do:{en:['After a strong earthquake near the coast, or if the sea suddenly draws back, move inland or uphill at once. Do not wait for a warning.','Stay far from the beach and out of the sea for many hours. Waves can keep coming.','During cyclone warnings, leave low coastal areas when told.'],ta:['கடற்கரைக்கு அருகில் வலுவான நிலநடுக்கம் ஏற்பட்டாலோ கடல் திடீரென உள்வாங்கினாலோ உடனே உள்நாட்டுப் பக்கம் அல்லது உயரமான இடத்துக்குச் செல்லுங்கள். எச்சரிக்கைக்குக் காத்திருக்காதீர்கள்.','பல மணி நேரம் கடற்கரையிலிருந்து தொலைவில் இருங்கள்; கடலுக்குள் செல்லாதீர்கள். அலைகள் தொடர்ந்து வரலாம்.','புயல் எச்சரிக்கையின்போது சொன்னவுடன் தாழ்வான கடலோரப் பகுதிகளை விட்டு வெளியேறுங்கள்.']},
 d:'In deep water a tsunami travels at about 700–800 km/h with wavelengths of tens to hundreds of kilometres. Storm surge is a wind-driven rise of the sea surface, and its height adds to the astronomical tide to give the storm tide.'},
{id:'gh',cat:'clim',ic:'house',demo:'greenhouse',t:{en:'The greenhouse effect',ta:'பசுமைக்குடில் விளைவு'},
 k:{en:'Some gases in the air work like a blanket. They let sunlight in but slow down heat leaving. Without any blanket Earth would be freezing. A blanket that is too thick makes it too warm.',ta:'காற்றிலுள்ள சில வாயுக்கள் போர்வை போலச் செயல்படுகின்றன. அவை சூரிய ஒளியை உள்ளே விடுகின்றன, ஆனால் வெப்பம் வெளியேறுவதை மெதுவாக்குகின்றன. போர்வையே இல்லாவிட்டால் பூமி உறைந்துவிடும். போர்வை மிகவும் தடிமனானால் பூமி அதிகம் சூடாகும்.'},
 a:{en:'Sunlight warms the surface. The surface sends heat back out as infrared radiation. Greenhouse gases such as water vapour, carbon dioxide and methane absorb some of that heat and send part of it back down. This natural effect keeps Earth about 33 °C warmer than it would otherwise be. Burning fuels and clearing forests have added more of these gases and strengthened the effect.',ta:'சூரிய ஒளி பூமியின் மேற்பரப்பை வெப்பப்படுத்துகிறது. மேற்பரப்பு அந்த வெப்பத்தை அகச்சிவப்புக் கதிர்களாக வெளியே அனுப்புகிறது. நீராவி, கார்பன் டை ஆக்சைடு, மீத்தேன் போன்ற பசுமைக்குடில் வாயுக்கள் அதில் ஒரு பகுதியை உறிஞ்சி, சிறிதளவைக் கீழ்நோக்கித் திருப்புகின்றன. இந்த இயற்கை விளைவு பூமியை இல்லாத நிலையைவிட சுமார் 33 °C வெப்பமாக வைத்திருக்கிறது. எரிபொருள்களை எரிப்பதும் காடுகளை அழிப்பதும் இந்த வாயுக்களை அதிகரித்து விளைவை வலுப்படுத்தியுள்ளன.'},
 d:'Doubling CO₂ gives a radiative forcing of about 4 W/m². Equilibrium climate sensitivity, the long-run warming for doubled CO₂, is assessed as likely between 2.5 and 4 °C with a best estimate of 3 °C (IPCC AR6).'},
{id:'warm',cat:'clim',ic:'globe',t:{en:'Global warming and climate change',ta:'புவி வெப்பமாதலும் காலநிலை மாற்றமும்'},
 k:{en:'Earth has become warmer over the last 150 years, mostly because people burn coal, oil and gas. A warmer Earth changes rain, seas and ice. We can slow it down.',ta:'கடந்த 150 ஆண்டுகளில் பூமி வெப்பமாகிவிட்டது; முக்கியக் காரணம் மனிதர்கள் நிலக்கரி, எண்ணெய், வாயுவை எரிப்பது. வெப்பமான பூமி மழையையும் கடலையும் பனியையும் மாற்றுகிறது. நாம் இதை மெதுவாக்கலாம்.'},
 a:{en:'Earth’s average surface temperature is about 1.1 °C higher than in 1850–1900. Human activities are the dominant cause: burning coal, oil and gas, cutting forests, and farming and waste that release methane and nitrous oxide. Warming is uneven. Land warms faster than oceans, the Arctic warms fastest, and rainfall changes differ by region. In many places climate change brings more frequent heat extremes and heavier downpours. Every extra bit of warming adds to the risk, so every reduction matters.',ta:'பூமியின் சராசரி மேற்பரப்பு வெப்பநிலை 1850–1900 காலத்தைவிட சுமார் 1.1 °C அதிகம். மனித செயல்பாடுகளே முதன்மைக் காரணம்: நிலக்கரி, எண்ணெய், வாயுவை எரிப்பது, காடுகளை அழிப்பது, மீத்தேன், நைட்ரஸ் ஆக்சைடு வெளியிடும் வேளாண்மையும் கழிவுகளும். வெப்பமாதல் சமமாக இல்லை. நிலம் கடலைவிட வேகமாகவும், ஆர்க்டிக் அதைவிட வேகமாகவும் சூடாகிறது; மழை மாற்றங்கள் பகுதிக்குப் பகுதி வேறுபடுகின்றன. பல இடங்களில் காலநிலை மாற்றம் அடிக்கடி வெப்பத் தீவிரங்களையும் கனமழையையும் தருகிறது. கூடுதல் ஒவ்வொரு பங்கு வெப்பமும் இடரைக் கூட்டுவதால், ஒவ்வொரு குறைப்பும் முக்கியம்.'},
 d:'Evidence includes CO₂ rising from about 280 ppm before industry to above 420 ppm, the isotopic signature of fossil carbon, ocean heat uptake, shrinking ice, and the fingerprint of tropospheric warming with stratospheric cooling, which a brighter Sun would not produce.'},
{id:'sea',cat:'clim',ic:'sea',t:{en:'Rising seas',ta:'உயரும் கடல்மட்டம்'},
 k:{en:'The sea is rising because warm water takes more space and because ice on land is melting into the sea. Low coasts feel it first.',ta:'சூடான நீர் அதிக இடத்தை எடுப்பதாலும் நிலத்திலுள்ள பனி உருகிக் கடலில் சேர்வதாலும் கடல்மட்டம் உயர்கிறது. தாழ்வான கடற்கரைகள் முதலில் உணர்கின்றன.'},
 a:{en:'Global sea level rose about 20 cm between 1901 and 2018, and the rate has increased. There are two main causes: warming water expands, and melting glaciers and ice sheets add water. Even a small rise lets storm surges and high tides reach farther inland. Local effects also depend on land sinking, river sediment, sand mining and harbours, so each coast needs its own study.',ta:'1901 முதல் 2018 வரை உலகக் கடல்மட்டம் சுமார் 20 செ.மீ உயர்ந்துள்ளது; உயரும் வேகமும் கூடியுள்ளது. இரண்டு முக்கியக் காரணங்கள்: சூடாகும் நீர் விரிவடைகிறது, உருகும் பனியாறுகளும் பனிப்படலங்களும் நீரைச் சேர்க்கின்றன. சிறிய உயர்வும் புயல் கடல் எழுச்சியையும் உயர் அலைகளையும் உள்நாட்டு நோக்கி மேலும் தொலைவுக்குக் கொண்டு செல்கிறது. நிலம் தாழ்வது, ஆற்று வண்டல், மணல் அள்ளுதல், துறைமுகங்கள் ஆகியவையும் உள்ளூர் விளைவைத் தீர்மானிப்பதால் ஒவ்வொரு கடற்கரைக்கும் தனி ஆய்வு தேவை.'},
 d:'Observed global mean rise accelerated from about 1.3 mm per year (1901–1971) to 1.9 (1971–2006) and 3.7 mm per year (2006–2018), according to IPCC AR6.'},
{id:'coral',cat:'clim',ic:'coral',t:{en:'Warm oceans and coral bleaching',ta:'வெப்பக் கடலும் பவளப்பாறை வெளுத்தலும்'},
 k:{en:'The ocean soaks up most of the extra heat. When the sea is too warm for too long, corals lose their colourful algae partners and turn white. That is called bleaching.',ta:'கூடுதல் வெப்பத்தில் பெரும்பகுதியைக் கடல் உறிஞ்சுகிறது. கடல் நீண்ட காலம் அதிக வெப்பமாக இருந்தால் பவளங்கள் தம் வண்ண நுண்பாசிகளை இழந்து வெண்மையாகின்றன. இதுவே வெளுத்தல்.'},
 a:{en:'The oceans have absorbed about 90% of the extra heat trapped by greenhouse gases. Marine heatwaves stress corals, fish and seagrass. Bleached corals can recover if the heat passes quickly, but long or repeated heat kills them. Coral reefs shelter many fish and protect coasts, including in the Gulf of Mannar.',ta:'பசுமைக்குடில் வாயுக்கள் சிறைப்பிடிக்கும் கூடுதல் வெப்பத்தில் சுமார் 90%-ஐ பெருங்கடல்கள் உறிஞ்சியுள்ளன. கடல் வெப்ப அலைகள் பவளங்கள், மீன்கள், கடற்புற்கள் ஆகியவற்றை அழுத்துகின்றன. வெப்பம் விரைவில் கடந்தால் வெளுத்த பவளங்கள் மீளலாம்; நீண்ட அல்லது மீண்டும் மீண்டும் வரும் வெப்பம் அவற்றைக் கொன்றுவிடும். மன்னார் வளைகுடா உட்பட பவளப்பாறைகள் பல மீன்களுக்குத் தங்குமிடம் தந்து கடற்கரையையும் காக்கின்றன.'},
 d:'Bleaching is expected when sea temperature exceeds the local summer maximum by about 1 °C for several weeks, tracked as degree heating weeks. Rising CO₂ also acidifies seawater, which makes it harder for shell-building and reef-building organisms to form their skeletons.'},
{id:'ice',cat:'clim',ic:'ice',t:{en:'Melting glaciers and ice sheets',ta:'உருகும் பனியாறுகளும் பனிப்படலங்களும்'},
 k:{en:'Ice on land melts a little faster each year. The melted water runs into the sea and makes it rise. Himalayan glaciers also feed rivers that many people use.',ta:'நிலத்திலுள்ள பனி ஒவ்வோர் ஆண்டும் சற்று வேகமாக உருகுகிறது. உருகிய நீர் கடலில் சேர்ந்து கடலை உயர்த்துகிறது. இமயமலைப் பனியாறுகள் பலர் பயன்படுத்தும் ஆறுகளுக்கும் நீர் தருகின்றன.'},
 a:{en:'Glaciers and the ice sheets of Greenland and Antarctica are losing mass. Floating sea ice does not raise sea level when it melts, but losing it lets the dark ocean absorb more sunlight, which speeds warming. Himalayan glaciers feed rivers that support hundreds of millions of people. Melting changes river flows and can cause sudden glacial-lake floods.',ta:'பனியாறுகளும் கிரீன்லாந்து, அண்டார்டிகா பனிப்படலங்களும் எடையை இழந்து வருகின்றன. மிதக்கும் கடல் பனி உருகினால் கடல்மட்டம் உயராது; ஆனால் அது மறைவதால் கருமையான கடல் அதிக சூரிய ஒளியை உறிஞ்சி வெப்பமாதலை வேகப்படுத்துகிறது. இமயமலைப் பனியாறுகள் நூறு கோடிக்கும் மேற்பட்ட மக்களுக்கு ஆதாரமான ஆறுகளுக்கு நீர் தருகின்றன. உருகுதல் ஆற்று ஓட்டத்தை மாற்றி, பனியாறு ஏரி திடீர் வெள்ளங்களையும் உண்டாக்கலாம்.'},
 d:'Ice-albedo feedback amplifies Arctic warming. Glacier retreat first increases river flow and later reduces it once the ice store is depleted, so water planning must account for a peak followed by decline.'},
{id:'ozone',cat:'clim',ic:'ozone',t:{en:'The ozone hole is not global warming',ta:'ஓசோன் துளை புவி வெப்பமாதல் அல்ல'},
 k:{en:'The ozone layer is like sunscreen high in the sky that blocks harmful sunlight. Some old chemicals made a hole in it. The world agreed to stop using them, and it is slowly healing.',ta:'ஓசோன் படலம் வானில் உயரத்தில் உள்ள சன்ஸ்கிரீன் போல; தீங்கான சூரியக் கதிர்களைத் தடுக்கிறது. சில பழைய வேதிப்பொருள்கள் அதில் துளையை ஏற்படுத்தின. அவற்றைப் பயன்படுத்துவதை நிறுத்த உலகம் ஒப்புக்கொண்டது; அது மெதுவாக ஆறி வருகிறது.'},
 a:{en:'Many people mix up ozone depletion and climate change, but they are different problems. Ozone depletion was caused mainly by chemicals such as CFCs, which thinned the layer that blocks harmful ultraviolet rays. The Montreal Protocol phased them out and the layer is recovering. Climate change is caused mainly by carbon dioxide and other greenhouse gases that trap heat. Some chemicals matter for both, which is why later agreements also cut them.',ta:'பலர் ஓசோன் குறைவையும் காலநிலை மாற்றத்தையும் குழப்பிக்கொள்கின்றனர்; ஆனால் அவை வேறு வேறு சிக்கல்கள். தீங்கான புற ஊதாக் கதிர்களைத் தடுக்கும் படலத்தை மெலிவாக்கியவை முக்கியமாக CFC போன்ற வேதிப்பொருள்கள். மாண்ட்ரீல் ஒப்பந்தம் அவற்றை நிறுத்தியது; படலம் மீண்டு வருகிறது. காலநிலை மாற்றத்துக்குக் காரணம் முக்கியமாக வெப்பத்தைச் சிறைப்பிடிக்கும் கார்பன் டை ஆக்சைடு உள்ளிட்ட பசுமைக்குடில் வாயுக்கள். சில வேதிப்பொருள்கள் இரண்டுக்கும் தொடர்புடையவை; அதனால்தான் பிந்தைய ஒப்பந்தங்களும் அவற்றைக் குறைக்கின்றன.'},
 d:'Assessments by WMO and UNEP project the ozone layer returning to 1980 values around 2040 over most of the world, around 2045 over the Arctic and around 2066 over Antarctica.'},
{id:'city',cat:'clim',ic:'city',t:{en:'Why cities are hotter',ta:'நகரங்கள் ஏன் அதிக வெப்பம்'},
 k:{en:'Roads and roofs soak up heat like a hot pan. Trees and ponds cool the air. So a leafy street feels cooler than a bare one.',ta:'சாலைகளும் கூரைகளும் சூடான வாணலி போல வெப்பத்தை உறிஞ்சுகின்றன. மரங்களும் குளங்களும் காற்றைக் குளிர்விக்கின்றன. அதனால் மரங்கள் நிறைந்த தெரு வெறும் தெருவைவிடக் குளிர்ச்சியாக உணரப்படும்.'},
 tr:{en:'With an adult, compare how warm a shaded stone and a sunny stone feel after noon.',ta:'பெரியவருடன் சேர்ந்து, மதியத்துக்குப் பின் நிழலிலுள்ள கல்லும் வெயிலிலுள்ள கல்லும் எவ்வளவு சூடு என்று ஒப்பிடு.'},
 a:{en:'Concrete, asphalt and dark roofs absorb heat by day and release it at night, while buildings block wind and air conditioners add heat. Fewer trees and wetlands means less cooling by evaporation. As a result cities can be several degrees warmer than nearby countryside, especially at night. Cool roofs, shade trees, open water and well-ventilated design all help, and they protect the elderly most.',ta:'காங்கிரீட், தார்ச்சாலை, கருமையான கூரைகள் பகலில் வெப்பத்தை உறிஞ்சி இரவில் வெளியிடுகின்றன; கட்டடங்கள் காற்றைத் தடுக்கின்றன, குளிரூட்டிகள் வெப்பத்தைச் சேர்க்கின்றன. மரங்களும் ஈரநிலங்களும் குறைந்தால் ஆவியாதல் மூலம் குளிர்ச்சி குறையும். அதனால் நகரங்கள் அருகிலுள்ள கிராமப்புறத்தைவிட, குறிப்பாக இரவில், பல டிகிரி அதிக வெப்பமாக இருக்கலாம். குளிர்ச்சிக் கூரைகள், நிழல் மரங்கள், திறந்த நீர்நிலைகள், காற்றோட்டமான வடிவமைப்பு ஆகியவை உதவும்; முதியோரை அவை அதிகம் காக்கும்.'},
 d:'Urban heat-island intensity is largest at night under calm, clear skies. It is distinct from greenhouse-driven warming and adds to it for city residents.'},
{id:'carbon',cat:'clim',ic:'leaf',t:{en:'Forests, oceans and the carbon cycle',ta:'காடுகள், கடல்கள், கார்பன் சுழற்சி'},
 k:{en:'Plants breathe in carbon dioxide and use it to grow. Forests and oceans take in part of the carbon dioxide we release. Cutting forests and burning fuels puts more into the air.',ta:'தாவரங்கள் கார்பன் டையாக்சைடை எடுத்து வளர்கின்றன. நாம் வெளியிடும் கார்பன் டையாக்சைடில் ஒரு பகுதியைக் காடுகளும் கடல்களும் உறிஞ்சுகின்றன. காடுகளை வெட்டுவதும் எரிபொருள் எரிப்பதும் காற்றில் அதிகம் சேர்க்கிறது.'},
 a:{en:'Carbon moves between air, plants, soil, oceans and rocks. Plants take in CO₂ by photosynthesis and oceans dissolve it. Land and oceans together absorb roughly half of what people emit. Burning fossil fuels moves ancient carbon into the air faster than natural processes can remove it. The dissolved CO₂ also makes the sea more acidic, which harms shells and corals. Protecting forests, mangroves, wetlands and soils keeps carbon stored and also protects people from floods and heat.',ta:'கார்பன் காற்று, தாவரங்கள், மண், கடல், பாறைகளுக்கு இடையே நகர்கிறது. தாவரங்கள் ஒளிச்சேர்க்கையால் CO₂-ஐ எடுக்கின்றன; கடல்கள் அதைக் கரைக்கின்றன. மனிதர் வெளியிடுவதில் ஏறக்குறைய பாதியை நிலமும் கடலும் சேர்ந்து உறிஞ்சுகின்றன. படிம எரிபொருள்களை எரிப்பது பழங்கால கார்பனை இயற்கை நீக்குவதைவிட வேகமாகக் காற்றில் சேர்க்கிறது. கரைந்த CO₂ கடலை அதிக அமிலமாக்கி ஓடுகளையும் பவளங்களையும் பாதிக்கிறது. காடுகள், அலையாத்திக் காடுகள், ஈரநிலங்கள், மண்ணைப் பாதுகாப்பது கார்பனைச் சேமித்து வைப்பதுடன் வெள்ளம், வெப்பத்திலிருந்தும் மக்களைக் காக்கிறது.'},
 d:'Fossil fuels and industry account for roughly nine-tenths of recent anthropogenic CO₂ emissions and land-use change for about one-tenth. About 45 to 50 percent of emitted CO₂ stays in the air, and the rest is taken up by land and ocean sinks, which could weaken in a warmer world.'},
{id:'warn',cat:'act',ic:'cal',t:{en:'Reading a forecast and a warning',ta:'முன்னறிவிப்பையும் எச்சரிக்கையையும் படிப்பது'},
 k:{en:'Colours tell us how careful to be. Green: all is fine. Yellow: be watchful. Orange: be ready. Red: take action now.',ta:'நிறங்கள் எவ்வளவு கவனமாக இருக்க வேண்டும் என்று சொல்கின்றன. பச்சை: எல்லாம் சரி. மஞ்சள்: கவனமாக இருங்கள். ஆரஞ்சு: தயாராக இருங்கள். சிவப்பு: உடனே செயல்படுங்கள்.'},
 a:{en:'India’s weather department (IMD) uses four colours. Green means no warning. Yellow means be aware and watch for updates. Orange means be prepared, because disruption is likely. Red means take action, because severe weather is expected. A forecast is a probability, not a promise: a 70% chance of rain means rain is more likely than not, not a guarantee. Warnings cover an area and a time, so check what applies to your place. In 24 hours, rain of 64.5 to 115.5 mm is called heavy, 115.6 to 204.4 mm very heavy, and 204.5 mm or more extremely heavy.',ta:'இந்திய வானிலைத் துறை (IMD) நான்கு நிறங்களைப் பயன்படுத்துகிறது. பச்சை என்றால் எச்சரிக்கை இல்லை. மஞ்சள் என்றால் கவனமாக இருந்து புதிய தகவல்களைப் பாருங்கள். ஆரஞ்சு என்றால் தடங்கல் வர வாய்ப்பு உள்ளதால் தயாராக இருங்கள். சிவப்பு என்றால் கடுமையான வானிலை எதிர்பார்க்கப்படுவதால் உடனே செயல்படுங்கள். முன்னறிவிப்பு ஒரு நிகழ்தகவு, உறுதிமொழி அல்ல: 70% மழை வாய்ப்பு என்றால் மழை வராமல் இருப்பதைவிட வருவதே அதிகம் என்று பொருள்; உறுதி அல்ல. எச்சரிக்கை ஒரு பகுதிக்கும் காலத்துக்கும் உரியது; உங்கள் இடத்துக்கு எது பொருந்தும் என்று பாருங்கள். 24 மணி நேரத்தில் 64.5 முதல் 115.5 மி.மீ மழை கனமழை, 115.6 முதல் 204.4 மி.மீ மிகக் கனமழை, 204.5 மி.மீ அல்லது அதற்கு மேல் அதிதீவிரக் கனமழை எனப்படும்.'},
 do:{en:['Check the IMD website or Mausam app and your state disaster-management alerts. Do not trust forwarded rumours.','Tell elderly relatives who do not use phones.','Learn your local siren, loudspeaker or fishermen’s warning system.'],ta:['இந்திய வானிலைத் துறை இணையதளம் அல்லது மௌசம் செயலி, உங்கள் மாநிலப் பேரிடர் மேலாண்மை எச்சரிக்கைகளைப் பாருங்கள். பகிரப்படும் வதந்திகளை நம்ப வேண்டாம்.','கைபேசி பயன்படுத்தாத முதிய உறவினர்களுக்குச் சொல்லுங்கள்.','உங்கள் ஊரின் சைரன், ஒலிபெருக்கி அல்லது மீனவர் எச்சரிக்கை முறையை அறிந்துகொள்ளுங்கள்.']},
 d:'Short-range forecasts rely on numerical models that solve atmospheric equations on a grid and assimilate observations from satellites, radars and stations. Skill falls with lead time because the atmosphere is chaotic. Nowcasts for the next 0 to 3 hours are the most reliable guide for thunderstorms.'},
{id:'act',cat:'act',ic:'heart',t:{en:'What can each of us do?',ta:'நாம் ஒவ்வொருவரும் என்ன செய்யலாம்?'},
 k:{en:'Switch off lights and fans you are not using. Plant a tree and care for it. Walk or cycle short trips. Ask your family to waste less food and water.',ta:'பயன்படுத்தாத விளக்குகளையும் மின்விசிறிகளையும் அணையுங்கள். ஒரு மரம் நட்டுப் பராமரியுங்கள். குறுகிய தூரம் நடந்தோ சைக்கிளிலோ செல்லுங்கள். உணவையும் நீரையும் வீணாக்காமல் இருக்க உங்கள் குடும்பத்திடம் சொல்லுங்கள்.'},
 a:{en:'There are two jobs. Mitigation means cutting greenhouse gases: cleaner electricity, efficient devices, public transport, less waste, protecting forests. Adaptation means reducing harm from changes already happening: early warnings, shade and cooling shelters, drainage, safe housing, drought-ready farming. Personal actions help and spread habits, but big change needs governments, industry and communities as well. A good test for any action: does it help many people, especially the most vulnerable, and does it avoid shifting the harm to someone else?',ta:'இரண்டு பணிகள் உள்ளன. தணிப்பு என்பது பசுமைக்குடில் வாயுக்களைக் குறைப்பது: தூய்மையான மின்சாரம், திறன்மிக்க கருவிகள், பொதுப் போக்குவரத்து, குறைந்த கழிவு, காடுகளைப் பாதுகாத்தல். தகவமைப்பு என்பது ஏற்கெனவே நடக்கும் மாற்றங்களின் தீங்கைக் குறைப்பது: முன்னெச்சரிக்கை, நிழல் மற்றும் குளிர்ச்சிக் காப்பகங்கள், வடிகால், பாதுகாப்பான வீடுகள், வறட்சிக்குத் தயாரான வேளாண்மை. தனிப்பட்ட செயல்கள் உதவுகின்றன, பழக்கங்களைப் பரப்புகின்றன; ஆனால் பெரிய மாற்றத்துக்கு அரசுகளும் தொழில்துறையும் சமூகங்களும் தேவை. எந்தச் செயலுக்கும் நல்ல சோதனை: இது பலருக்கு, குறிப்பாக மிகவும் பாதிக்கப்படக்கூடியவர்களுக்கு உதவுகிறதா, தீங்கை வேறொருவர் மேல் மாற்றாமல் இருக்கிறதா?'},
 d:'Pathways limiting warming to 1.5 °C require global CO₂ emissions to fall by about 45% from 2010 levels by 2030 and reach net zero around 2050 (IPCC SR1.5). Maladaptation occurs when an action raises long-term risk or shifts harm to another group or place.'}

let VOICES=[];
function loadVoices(){try{VOICES=window.speechSynthesis.getVoices()||[]}catch(e){VOICES=[]}}
function speak(text,l){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){toast(l==='ta'?'இந்தச் சாதனம் குரல் வாசிப்பை ஆதரிக்கவில்லை':'This device cannot read aloud');return}
  loadVoices();const pre=l==='ta'?'ta':'en';
  const v=VOICES.find(x=>x.lang.toLowerCase().replace('_','-').startsWith(pre+'-in'))||VOICES.find(x=>x.lang.toLowerCase().startsWith(pre));
  if(l==='ta'&&!v)toast('No Tamil voice found. Install one in the device’s text-to-speech settings. தமிழ் குரல் இல்லை.');
  window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=l==='ta'?'ta-IN':'en-IN';if(v)u.voice=v;u.rate=.88;window.speechSynthesis.speak(u);
}
function stopSpeech(){try{window.speechSynthesis.cancel()}catch(e){}}

  const sb=h('input',{type:'text',placeholder:lang()==='ta'?'சொல்லைத் தேடுங்கள்':'Search a word','aria-label':lang()==='ta'?'சொல்லைத் தேடு':'Search a word',autocomplete:'off'});
  const list=h('div',{style:'margin-top:10px'});
  const draw=()=>{const q=sb.value.trim().toLowerCase();const it=WORDS.filter(x=>!q||(x[0]+' '+x[1]+' '+x[2]).toLowerCase().includes(q));

      h('div',{style:'display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline'},h('b',{lang:'ta',style:'font-size:1.1em'},x[1]+(x[3]?'':' ⚠')),h('span',{class:'muted',lang:'en'},x[0])),

  sb.addEventListener('input',draw);draw();w.append(sb,list);

 {c:{en:'High up the air is cold. The vapour cools and turns into tiny drops. A cloud forms. This is condensation.',ta:'உயரத்தில் காற்று குளிராக இருக்கும். நீராவி குளிர்ந்து சிறு துளிகளாகிறது. மேகம் உருவாகிறது. இதுவே ஒடுக்கம்.'}},
 {c:{en:'Winds push the cloud over land and hills.',ta:'காற்று மேகத்தை நிலத்துக்கும் மலைகளுக்கும் தள்ளிச் செல்கிறது.'}},
 {c:{en:'The drops join and grow heavy, then fall as rain.',ta:'துளிகள் இணைந்து கனமாகி மழையாக விழுகின்றன.'}},

CLIPS.cloud={bg:'day',look:{en:'Why the cloud only appears when the air has risen high.',ta:'காற்று உயரே சென்ற பிறகே மேகம் ஏன் தோன்றுகிறது என்று பாருங்கள்.'},
 steps:[
 {c:{en:'The Sun heats the ground. Warm air near the ground is light, so it rises.',ta:'சூரியன் தரையை வெப்பப்படுத்துகிறது. தரைக்கு அருகிலுள்ள சூடான காற்று இலேசாகி மேலே எழுகிறது.'}},
 {c:{en:'Higher up, the air is cooler. Cool air cannot hold as much invisible water vapour.',ta:'உயரே காற்று குளிராக இருக்கும். குளிர்ந்த காற்றால் அதிக நீராவியைத் தாங்க முடியாது.'}},
 {c:{en:'The extra vapour sticks to tiny dust and salt grains and turns into tiny drops. Millions of drops make a cloud.',ta:'மிகுதி நீராவி சிறு தூசுத் துகள்கள், உப்புத் துகள்களின் மேல் ஒட்டி சிறு துளிகளாகிறது. கோடிக்கணக்கான துளிகள் சேர்ந்து மேகமாகிறது.'}},
 {c:{en:'The drops bump together and grow. When they are too heavy for the air to hold up, they fall as rain.',ta:'துளிகள் ஒன்றோடொன்று மோதிப் பெரிதாகின்றன. காற்றால் தாங்க முடியாத அளவு கனமானால் மழையாக விழுகின்றன.'}},
 {c:{en:'Tall dark clouds usually bring heavy rain and storms. Thin high clouds usually bring no rain.',ta:'உயரமான கருமேகங்கள் பொதுவாக கனமழையும் புயலும் தரும். மெல்லிய உயர மேகங்கள் பொதுவாக மழை தராது.'}}],

CLIPS.wind={bg:'day',look:{en:'Which way the air moves, and which way the tree bends.',ta:'காற்று எந்தப் பக்கம் நகர்கிறது, மரம் எந்தப் பக்கம் வளைகிறது என்று பாருங்கள்.'},
 steps:[
 {c:{en:'The Sun heats some places more than others. Here, bare ground gets hot while shaded ground stays cool.',ta:'சூரியன் சில இடங்களை மற்றவற்றைவிட அதிகம் வெப்பப்படுத்துகிறது. இங்கே வெறுந்தரை சூடாகிறது, நிழல் தரை குளிர்ச்சியாகவே இருக்கிறது.'}},
 {c:{en:'Warm air is light, so it floats up.',ta:'சூடான காற்று இலேசானது, எனவே மேலே மிதக்கிறது.'}},
 {c:{en:'Where air rose, less air presses down: low pressure. Over cool ground more air presses down: high pressure.',ta:'காற்று எழுந்த இடத்தில் கீழ்நோக்கி காற்றழுத்தம் குறைவு: குறைந்த காற்றழுத்தம். குளிர்ந்த தரையின் மேல் காற்றழுத்தம் அதிகம்: அதிக காற்றழுத்தம்.'}},
 {c:{en:'Air always moves from high pressure to low pressure. Moving air is wind.',ta:'காற்று எப்போதும் அதிக காற்றழுத்தத்திலிருந்து குறைந்த காற்றழுத்தத்தை நோக்கி நகரும். நகரும் காற்றே காற்று (வீசும் காற்று).'}},
 {c:{en:'We name a wind by where it comes from. A north-east wind comes from the north-east.',ta:'காற்றை அது எங்கிருந்து வருகிறதோ அந்தத் திசையால் பெயரிடுகிறோம். வடகிழக்குக் காற்று வடகிழக்கிலிருந்து வரும்.'}}],

CLIPS.humid={bg:'day',look:{en:'Where the sweat goes: into the air, or nowhere.',ta:'வியர்வை எங்கே செல்கிறது: காற்றிலா, அல்லது எங்கும் இல்லையா என்று பாருங்கள்.'},
 steps:[
 {c:{en:'Air always carries some invisible water vapour. We cannot see it, but it is there.',ta:'காற்றில் எப்போதும் சிறிது கண்ணுக்குத் தெரியாத நீராவி இருக்கும். நம்மால் பார்க்க முடியாது, ஆனால் அது உள்ளது.'}},
 {c:{en:'When we are hot we sweat. As sweat dries into the air, it takes heat away and cools us.',ta:'சூடாக இருக்கும்போது வியர்க்கிறோம். வியர்வை காற்றில் காயும்போது வெப்பத்தை எடுத்துச் சென்று நம்மைக் குளிர்விக்கிறது.'}},
 {c:{en:'In dry air, sweat dries fast, so we cool down well.',ta:'வறண்ட காற்றில் வியர்வை வேகமாகக் காயும்; அதனால் நன்றாகக் குளிர்கிறோம்.'}},
 {c:{en:'In humid air, the air is already nearly full of vapour. Sweat cannot dry, so we stay sticky and feel hotter.',ta:'ஈரப்பதமான காற்றில் ஏற்கெனவே நீராவி நிறைந்திருக்கும். வியர்வை காய முடியாது; அதனால் புழுக்கமாகவும் அதிகச் சூடாகவும் உணர்கிறோம்.'}},
 {c:{en:'So the same thermometer reading can feel very different in a dry place and a humid coastal town.',ta:'எனவே அதே வெப்பமானி அளவு வறண்ட இடத்திலும் ஈரப்பதமான கடலோர ஊரிலும் மிகவும் வேறுபட்டு உணரப்படும்.'}}],

CLIPS.storm={bg:'storm',look:{en:'What happens first: the flash, or the boom?',ta:'முதலில் என்ன நடக்கிறது: மின்னலா, இடியா என்று பாருங்கள்.'},
 steps:[
 {bg:'day',c:{en:'On a hot, humid day, warm moist air rises very fast.',ta:'சூடான, ஈரப்பதமான நாளில் சூடான ஈரக்காற்று மிக வேகமாக எழுகிறது.'}},
 {c:{en:'It climbs very high and builds a tall storm cloud.',ta:'அது மிக உயரத்துக்கு ஏறி உயரமான புயல் மேகத்தை உருவாக்குகிறது.'}},
 {c:{en:'Inside, ice and water drops rush up and down and rub together. Electric charge builds up: positive at the top, negative at the bottom.',ta:'உள்ளே பனியும் நீர்த்துளிகளும் மேலும் கீழும் விரைந்து உராய்கின்றன. மின்னூட்டம் சேர்கிறது: மேலே நேர்மின்னூட்டம், கீழே எதிர்மின்னூட்டம்.'}},
 {c:{en:'The charge jumps as a giant spark: lightning! It is hotter than the surface of the Sun for a moment.',ta:'மின்னூட்டம் ஒரு பெரிய தீப்பொறியாகத் தாவுகிறது: மின்னல்! அது ஒரு கணம் சூரியனின் மேற்பரப்பைவிட வெப்பமானது.'}},
 {c:{en:'The spark heats the air so fast that it booms: thunder. Light travels much faster than sound, so we see the flash first and hear the boom later.',ta:'அந்தப் பொறி காற்றை மிக வேகமாகச் சூடாக்குவதால் அது முழங்குகிறது: இடி. ஒளி ஒலியைவிட மிக வேகமாகப் பயணிப்பதால் முதலில் மின்னலைப் பார்க்கிறோம், பிறகு இடியைக் கேட்கிறோம்.'}},
 {c:{en:'Stay safe: go indoors. Do not shelter under a tree, because lightning can strike it.',ta:'பாதுகாப்பாக இருங்கள்: வீட்டுக்குள் செல்லுங்கள். மரத்தின் கீழ் ஒதுங்காதீர்கள்; மின்னல் அதைத் தாக்கலாம்.'}}],

CLIPS.breeze={bg:'day',look:{en:'The direction of the arrows near the ground, in each scene.',ta:'ஒவ்வொரு காட்சியிலும் தரைக்கு அருகிலுள்ள அம்புகளின் திசையைப் பாருங்கள்.'},
 steps:[
 {c:{en:'Land heats up fast in the sunshine. The sea heats up slowly. Water needs much more heat to warm the same amount.',ta:'வெயிலில் நிலம் வேகமாகச் சூடாகிறது. கடல் மெதுவாகச் சூடாகிறது. அதே அளவு நீரை சூடாக்க மிக அதிக வெப்பம் தேவை.'}},
 {c:{en:'Daytime: air over the warm land rises. Cooler air from the sea rushes in to replace it. That is a sea breeze.',ta:'பகல்: சூடான நிலத்தின் மேல் காற்று எழுகிறது. கடலின் குளிர்ந்த காற்று அதை நிரப்ப உள்ளே வருகிறது. இதுவே கடற்காற்று.'}},
 {bg:'night',c:{en:'Night: land cools quickly but the sea stays warmer. Air now rises over the sea and the breeze flows out to sea. That is a land breeze.',ta:'இரவு: நிலம் வேகமாகக் குளிர்கிறது, கடல் சூடாகவே இருக்கிறது. இப்போது கடலின் மேல் காற்று எழுந்து, தென்றல் கடலை நோக்கிச் செல்கிறது. இதுவே நிலக்காற்று.'}},
 {c:{en:'The monsoon is the same idea over a whole season: summer winds blow from sea to land, winter winds from land to sea.',ta:'பருவக்காற்றும் இதே கருத்துதான், ஒரு முழுப் பருவம் முழுவதும்: கோடையில் காற்று கடலிலிருந்து நிலத்துக்கு, குளிர்காலத்தில் நிலத்திலிருந்து கடலுக்கு.'}}],

CLIPS.monsoon={bg:'sea',look:{en:'The direction the wind comes from in summer, and in winter.',ta:'கோடையிலும் குளிர்காலத்திலும் காற்று எந்தத் திசையிலிருந்து வருகிறது என்று பாருங்கள்.'},
 steps:[
 {c:{en:'In summer, the huge land of India heats up much more than the ocean around it.',ta:'கோடையில் இந்தியாவின் பெரிய நிலப்பரப்பு சுற்றியுள்ள கடலைவிட மிக அதிகம் சூடாகிறது.'}},
 {c:{en:'Warm air rises over the land. Moist wind from the Indian Ocean rushes in from the south-west: the south-west monsoon, June to September.',ta:'நிலத்தின் மேல் சூடான காற்று எழுகிறது. இந்தியப் பெருங்கடலிலிருந்து ஈரக்காற்று தென்மேற்கிலிருந்து விரைந்து வருகிறது: தென்மேற்குப் பருவமழை, ஜூன் முதல் செப்டம்பர் வரை.'}},
 {c:{en:'The wind hits the Western Ghats and is forced up. It cools and drops its rain on the western side. Most of Tamil Nadu lies behind the hills, so it gets less.',ta:'காற்று மேற்குத் தொடர்ச்சி மலையில் மோதி மேலே தள்ளப்படுகிறது. அது குளிர்ந்து மேற்குப் பக்கம் மழையைப் பொழிகிறது. தமிழ்நாட்டின் பெரும்பகுதி மலைக்குப் பின்னால் இருப்பதால் குறைவாகப் பெறுகிறது.'}},
 {c:{en:'In winter the land cools. Wind now blows from the north-east, over the Bay of Bengal, and picks up moisture.',ta:'குளிர்காலத்தில் நிலம் குளிர்கிறது. இப்போது காற்று வடகிழக்கிலிருந்து வங்காள விரிகுடாவின் மேல் வீசி ஈரப்பதம் சேர்க்கிறது.'}},
 {c:{en:'From October to December this brings the north-east monsoon rain to Tamil Nadu.',ta:'அக்டோபர் முதல் டிசம்பர் வரை இது தமிழ்நாட்டுக்கு வடகிழக்குப் பருவமழையைக் கொண்டு வருகிறது.'}},
 {c:{en:'Monsoon rain comes in active spells and breaks. A good season overall can still have floods and dry weeks.',ta:'பருவமழை தீவிரக் காலங்களாகவும் இடைவெளிகளாகவும் வருகிறது. மொத்தத்தில் நல்ல பருவத்திலும் வெள்ளமும் வறண்ட வாரங்களும் இருக்கலாம்.'}}],

CLIPS.cyclone={bg:'day',look:{en:'Which way the storm spins, and where the calm eye is.',ta:'புயல் எந்தப் பக்கம் சுழல்கிறது, அமைதியான கண் எங்கே உள்ளது என்று பாருங்கள்.'},
 steps:[
 {c:{en:'A cyclone starts over very warm sea water, warmer than about 27 °C. The warm sea is its fuel.',ta:'புயல் மிகவும் வெப்பமான கடல் நீரின் மேல், சுமார் 27 °C-க்கு மேல், தொடங்குகிறது. வெப்பக் கடலே அதன் எரிபொருள்.'}},
 {c:{en:'Warm moist air rises fast and forms tall clouds. This leaves low pressure at the surface, so more air rushes in.',ta:'சூடான ஈரக்காற்று வேகமாக எழுந்து உயரமான மேகங்களை உருவாக்குகிறது. இதனால் மேற்பரப்பில் குறைந்த காற்றழுத்தம் ஏற்பட்டு, மேலும் காற்று உள்ளே விரைகிறது.'}},
 {bg:'sea',c:{en:'Seen from above: the Earth’s spin twists the rushing air, so the whole storm begins to spin.',ta:'மேலிருந்து பார்த்தால்: பூமியின் சுழற்சி விரைந்து வரும் காற்றைத் திருப்புகிறது; அதனால் முழுப் புயலும் சுழலத் தொடங்குகிறது.'}},
 {bg:'sea',c:{en:'The strongest winds and heaviest rain circle the calm centre, called the eye.',ta:'வலுவான காற்றும் கனமழையும் கண் எனப்படும் அமைதியான மையத்தைச் சுற்றுகின்றன.'}},
 {bg:'storm',c:{en:'Strong winds push sea water ahead of the storm onto the coast. This is storm surge, and it can flood far inland.',ta:'வலுவான காற்று புயலுக்கு முன்னால் கடல் நீரைக் கரைமேல் தள்ளுகிறது. இதுவே புயல் கடல் எழுச்சி; அது உள்நாட்டுக்குள் வெகுதூரம் வெள்ளமாகலாம்.'}},

CLIPS.enso={bg:'day',look:{en:'How the warm orange water moves along the Pacific.',ta:'சூடான ஆரஞ்சு நிற நீர் பசிபிக்கில் எப்படி நகர்கிறது என்று பாருங்கள்.'},
 steps:[
 {c:{en:'This is a slice through the Pacific Ocean. Normally, winds called trade winds blow from east to west across it.',ta:'இது பசிபிக் பெருங்கடலின் குறுக்கு வெட்டுத் தோற்றம். வழக்கமாக வாணிபக் காற்றுகள் கிழக்கிலிருந்து மேற்கே வீசுகின்றன.'}},
 {c:{en:'They push the warm surface water towards the west. On the east side, cool deep water rises up.',ta:'அவை சூடான மேற்பரப்பு நீரை மேற்கு நோக்கித் தள்ளுகின்றன. கிழக்குப் பக்கம் குளிர்ந்த ஆழ்நீர் மேலே எழுகிறது.'}},
 {c:{en:'El Niño: the trade winds weaken. The warm water slides back towards the east.',ta:'எல் நினோ: வாணிபக் காற்றுகள் வலுவிழக்கின்றன. சூடான நீர் மீண்டும் கிழக்கு நோக்கி நகர்கிறது.'}},
 {c:{en:'Rain clouds follow the warm water east. So rain and heat patterns change in many places around the world.',ta:'மழை மேகங்கள் சூடான நீரைப் பின்தொடர்ந்து கிழக்கே செல்கின்றன. அதனால் உலகின் பல இடங்களில் மழை, வெப்ப முறைகள் மாறுகின்றன.'}},
 {c:{en:'La Niña: the trade winds get stronger. Warm water piles up in the west and the east becomes cooler.',ta:'லா நினா: வாணிபக் காற்றுகள் வலுப்பெறுகின்றன. சூடான நீர் மேற்கில் குவிகிறது; கிழக்கு இன்னும் குளிர்கிறது.'}},
 {c:{en:'These swings happen naturally every few years. They affect India’s rain, but not in the same way every time.',ta:'இந்த ஏற்ற இறக்கங்கள் சில ஆண்டுகளுக்கு ஒருமுறை இயற்கையாக நடக்கின்றன. அவை இந்தியாவின் மழையைப் பாதிக்கின்றன, ஆனால் ஒவ்வொரு முறையும் ஒரே விதமாக அல்ல.'}}],

CLIPS.heat={bg:'day',look:{en:'The days turning red one by one, and what happens at night.',ta:'நாட்கள் ஒவ்வொன்றாகச் சிவப்பாவதையும் இரவில் என்ன நடக்கிறது என்பதையும் பாருங்கள்.'},
 steps:[
 {c:{en:'A heatwave is many days in a row of unusually hot weather.',ta:'வெப்ப அலை என்பது தொடர்ந்து பல நாட்கள் வழக்கத்துக்கு மாறாக மிகுந்த வெப்பம் நிலவுவது.'}},
 {bg:'dusk',c:{en:'In a heatwave even the nights stay hot. The body gets no time to cool down and recover.',ta:'வெப்ப அலையில் இரவுகளும் சூடாகவே இருக்கும். உடல் குளிர்ந்து மீள நேரம் கிடைப்பதில்லை.'}},
 {c:{en:'Humid air makes it worse. Sweat cannot dry, so the body overheats.',ta:'ஈரப்பதமான காற்று நிலைமையை மோசமாக்குகிறது. வியர்வை காய முடியாது; உடல் அதிகமாகச் சூடாகிறது.'}},
 {c:{en:'Babies, elders, outdoor workers and people with heart or kidney illness are at the highest risk.',ta:'குழந்தைகள், முதியோர், வெளியில் வேலை செய்வோர், இதயம் அல்லது சிறுநீரக நோய் உள்ளவர்கள் மிக அதிக ஆபத்தில் உள்ளனர்.'}},
 {c:{en:'Stay safe: drink water often, rest in shade at noon, and check on elders twice a day.',ta:'பாதுகாப்பாக இருங்கள்: அடிக்கடி தண்ணீர் குடியுங்கள், மதிய நேரத்தில் நிழலில் ஓய்வெடுங்கள், முதியோரை நாளுக்கு இருமுறை பாருங்கள்.'}}],

 {c:{en:'Then a long dry spell comes. Weeks pass with no rain, and the Sun beats down.',ta:'பிறகு நீண்ட வறண்ட காலம் வருகிறது. வாரங்கள் மழையின்றிக் கடக்கின்றன; சூரியன் சுட்டெரிக்கிறது.'}},

 {bg:'day',c:{en:'Storm surge is weather, so it can be forecast days ahead. There is time to move to safety.',ta:'புயல் கடல் எழுச்சி வானிலை நிகழ்வு; எனவே நாட்களுக்கு முன்பே முன்னறிவிக்கலாம். பாதுகாப்பான இடத்துக்குச் செல்ல நேரம் உண்டு.'}},
 {bg:'day',c:{en:'Tsunami: an earthquake under the sea suddenly lifts the sea floor. A huge mass of water starts to move.',ta:'சுனாமி: கடலுக்கடியில் நிலநடுக்கம் திடீரெனக் கடல் தரையை உயர்த்துகிறது. மிகப் பெரிய நீர்த்திரள் நகரத் தொடங்குகிறது.'}},
 {bg:'day',c:{en:'In deep water the waves are low but very fast. Near the shore they slow down, bunch up and grow tall.',ta:'ஆழ்கடலில் அலைகள் தாழ்வாகவும் மிக வேகமாகவும் இருக்கும். கரைக்கு அருகில் அவை மெதுவாகி, குவிந்து, உயரமாகின்றன.'}},

CLIPS.gh={bg:'day',look:{en:'How many red heat arrows escape to space in each scene.',ta:'ஒவ்வொரு காட்சியிலும் எத்தனை சிவப்பு வெப்ப அம்புகள் விண்வெளிக்குத் தப்புகின்றன என்று பாருங்கள்.'},
 steps:[
 {c:{en:'Sunlight passes through the air and warms the ground.',ta:'சூரிய ஒளி காற்றைக் கடந்து தரையை வெப்பப்படுத்துகிறது.'}},
 {c:{en:'The warm ground sends heat back up as invisible infrared rays. Without anything in the way, this heat escapes to space.',ta:'சூடான தரை வெப்பத்தை கண்ணுக்குத் தெரியாத அகச்சிவப்புக் கதிர்களாக மேலே அனுப்புகிறது. தடையில்லாவிட்டால் இந்த வெப்பம் விண்வெளிக்குத் தப்பிவிடும்.'}},
 {c:{en:'Greenhouse gases in the air catch some of this heat and send part of it back down, like a blanket.',ta:'காற்றிலுள்ள பசுமைக்குடில் வாயுக்கள் இந்த வெப்பத்தில் சிலவற்றைப் பிடித்து, ஒரு பகுதியைப் போர்வை போலக் கீழே திருப்பி அனுப்புகின்றன.'}},
 {c:{en:'This natural blanket keeps Earth about 33 °C warmer than it would be. Without it, Earth would be frozen.',ta:'இந்த இயற்கைப் போர்வை பூமியை இல்லாத நிலையைவிட சுமார் 33 °C வெப்பமாக வைத்திருக்கிறது. அது இல்லாவிட்டால் பூமி உறைந்திருக்கும்.'}},
 {c:{en:'Burning coal, oil and gas, and cutting forests, add more gas. The blanket gets thicker.',ta:'நிலக்கரி, எண்ணெய், வாயுவை எரிப்பதும் காடுகளை அழிப்பதும் மேலும் வாயுவைச் சேர்க்கின்றன. போர்வை தடிமனாகிறது.'}},
 {c:{en:'Now even less heat escapes, so Earth slowly warms until it balances at a hotter level.',ta:'இப்போது இன்னும் குறைந்த வெப்பமே வெளியேறுகிறது; அதனால் பூமி மெதுவாக வெப்பமாகி, அதிக வெப்ப நிலையில் சமநிலை அடைகிறது.'}}],

CLIPS.warm={bg:'day',look:{en:'The two bars of carbon dioxide, and the two lines on the chart.',ta:'கார்பன் டையாக்சைடின் இரண்டு பட்டைகளையும் வரைபடத்தின் இரண்டு கோடுகளையும் பாருங்கள்.'},
 steps:[
 {c:{en:'For about 150 years people have burned coal, oil and gas for electricity, factories and travel.',ta:'சுமார் 150 ஆண்டுகளாக மனிதர்கள் மின்சாரம், தொழிற்சாலைகள், பயணத்துக்காக நிலக்கரி, எண்ணெய், வாயுவை எரித்து வருகின்றனர்.'}},
 {c:{en:'This releases carbon dioxide, which builds up in the air: from about 280 ppm before industry to over 420 ppm now.',ta:'இது கார்பன் டையாக்சைடை வெளியிடுகிறது; அது காற்றில் சேர்கிறது: தொழிற்புரட்சிக்கு முன் சுமார் 280 ppm, இப்போது 420 ppm-க்கு மேல்.'}},
 {c:{en:'More gas traps more heat. Earth’s average temperature has risen about 1.1 °C.',ta:'அதிக வாயு அதிக வெப்பத்தைச் சிறைப்பிடிக்கிறது. பூமியின் சராசரி வெப்பநிலை சுமார் 1.1 °C உயர்ந்துள்ளது.'}},
 {c:{en:'A warmer Earth brings more heatwaves, heavier downpours, melting ice and rising seas.',ta:'வெப்பமான பூமி அதிக வெப்ப அலைகள், கனமழை, உருகும் பனி, உயரும் கடலைக் கொண்டுவருகிறது.'}},
 {c:{en:'Natural causes cannot explain this rise. The Sun’s brightness has not increased, but the temperature line keeps climbing.',ta:'இயற்கைக் காரணங்களால் இந்த உயர்வை விளக்க முடியாது. சூரியனின் பிரகாசம் கூடவில்லை; ஆனால் வெப்பநிலைக் கோடு தொடர்ந்து ஏறுகிறது.'}},

 steps:[
 {c:{en:'Seas are rising for two reasons. First: when water warms, it expands and takes up more space.',ta:'கடல்மட்டம் இரண்டு காரணங்களால் உயர்கிறது. முதலாவது: நீர் சூடாகும்போது விரிவடைந்து அதிக இடத்தை எடுக்கிறது.'}},
 {c:{en:'Second: ice on land, in glaciers and ice sheets, melts and runs into the sea.',ta:'இரண்டாவது: நிலத்திலுள்ள பனியாறுகளும் பனிப்படலங்களும் உருகிக் கடலுக்குள் ஓடுகின்றன.'}},

 {c:{en:'Even a small rise lets high tides and storm surges reach farther inland.',ta:'சிறிய உயர்வும் உயர் அலைகளையும் புயல் கடல் எழுச்சியையும் உள்நாட்டுக்குள் மேலும் தொலைவு செல்ல விடுகிறது.'}},

CLIPS.coral={bg:'under',look:{en:'The colour of the corals, and the green dots inside them.',ta:'பவளங்களின் நிறத்தையும் அவற்றினுள் உள்ள பச்சைப் புள்ளிகளையும் பாருங்கள்.'},
 steps:[
 {c:{en:'Corals are tiny animals. Colourful algae live inside them, giving them food and their colour.',ta:'பவளங்கள் சிறு விலங்குகள். வண்ண நுண்பாசிகள் அவற்றினுள் வாழ்ந்து உணவையும் நிறத்தையும் தருகின்றன.'}},
 {c:{en:'The ocean absorbs most of the extra heat. Sometimes the sea water stays too warm for weeks.',ta:'கூடுதல் வெப்பத்தில் பெரும்பகுதியைக் கடல் உறிஞ்சுகிறது. சில நேரம் கடல் நீர் வாரக்கணக்கில் அதிக வெப்பமாகவே இருக்கிறது.'}},
 {c:{en:'Stressed corals push out their algae. Without them the coral turns white. This is called bleaching.',ta:'காற்றழுத்தத்துக்குள்ளான பவளங்கள் தம் நுண்பாசிகளை வெளியேற்றுகின்றன. அவை இல்லாமல் பவளம் வெண்மையாகிறது. இதுவே வெளுத்தல்.'}},
 {c:{en:'If the heat passes quickly, the algae can return and the coral recovers. If it lasts or comes again and again, the coral starves and dies.',ta:'வெப்பம் விரைவில் கடந்தால் நுண்பாசிகள் திரும்பி பவளம் மீளும். நீடித்தாலோ மீண்டும் மீண்டும் வந்தாலோ பவளம் பட்டினியால் இறக்கும்.'}},
 {c:{en:'Healthy reefs shelter fish and soften waves that hit the coast, like the reefs of the Gulf of Mannar.',ta:'ஆரோக்கியமான பவளப்பாறைகள் மீன்களுக்குத் தங்குமிடம் தந்து, மன்னார் வளைகுடாவின் பாறைகள் போல, கரையைத் தாக்கும் அலைகளைத் தணிக்கின்றன.'}}],

CLIPS.ice={bg:'day',look:{en:'How big the glacier is in each scene, and the shape of the river line.',ta:'ஒவ்வொரு காட்சியிலும் பனியாறு எவ்வளவு பெரியது, ஆற்றுக் கோட்டின் வடிவம் என்ன என்று பாருங்கள்.'}, 
 steps:[
 {c:{en:'Glaciers form where more snow falls than melts. Over many years, the snow piles up and turns to ice.',ta:'உருகுவதைவிட அதிகப் பனி விழும் இடங்களில் பனியாறுகள் உருவாகின்றன. பல ஆண்டுகளில் பனி குவிந்து பனிக்கட்டியாகிறது.'}},
 {c:{en:'The ice slowly flows downhill. In balance, new snow replaces the ice that melts at the bottom.',ta:'பனிக்கட்டி மெதுவாகச் சரிவில் கீழே பாய்கிறது. சமநிலையில், அடியில் உருகும் பனியை புதிய பனி ஈடு செய்கிறது.'}},
 {c:{en:'In a warmer world, more ice melts than new snow can replace, so the glacier shrinks.',ta:'வெப்பமான உலகில் புதிய பனி ஈடு செய்வதைவிட அதிகப் பனி உருகுகிறது; அதனால் பனியாறு சுருங்குகிறது.'}},
 {c:{en:'Meltwater feeds rivers, so rivers swell at first. Later, when the ice is gone, they run low.',ta:'உருகிய நீர் ஆறுகளுக்குப் போகிறது; முதலில் ஆறுகள் பெருகும். பின்னர் பனி தீர்ந்ததும் அவை வற்றும்.'}},
 {c:{en:'Melting sea ice exposes dark ocean. White ice reflects sunlight, but dark water absorbs it, so the Arctic warms even faster.',ta:'உருகும் கடல் பனி கருமையான கடலை வெளிப்படுத்துகிறது. வெண்பனி சூரிய ஒளியைத் திருப்பும்; கருநீர் அதை உறிஞ்சும்; அதனால் ஆர்க்டிக் இன்னும் வேகமாக வெப்பமாகிறது.'}}],

CLIPS.ozone={bg:'night',look:{en:'Which purple arrows are stopped, and which get through.',ta:'எந்த ஊதா அம்புகள் தடுக்கப்படுகின்றன, எவை கடந்து வருகின்றன என்று பாருங்கள்.'},
 steps:[
 {c:{en:'High above, the ozone layer works like sunscreen. It absorbs most of the Sun’s harmful ultraviolet (UV) rays.',ta:'உயரத்தில் ஓசோன் படலம் சன்ஸ்கிரீன் போலச் செயல்படுகிறது. சூரியனின் தீங்கான புற ஊதா (UV) கதிர்களில் பெரும்பகுதியை அது உறிஞ்சுகிறது.'}},
 {c:{en:'Old chemicals called CFCs, from old fridges and sprays, drifted up and broke ozone apart.',ta:'பழைய குளிர்சாதனப் பெட்டிகள், ஸ்ப்ரேக்களிலிருந்து வந்த CFC எனப்படும் வேதிப்பொருள்கள் மேலே சென்று ஓசோனை உடைத்தன.'}},
 {c:{en:'The layer thinned, especially over Antarctica: the ozone hole. More UV reaches the ground.',ta:'படலம் மெலிந்தது, குறிப்பாக அண்டார்டிகாவின் மேல்: ஓசோன் துளை. அதிக UV கதிர்கள் தரையை எட்டுகின்றன.'}},
 {c:{en:'The world agreed in the Montreal Protocol to stop using them. The layer is slowly healing.',ta:'அவற்றைப் பயன்படுத்துவதை நிறுத்த உலகம் மாண்ட்ரீல் ஒப்பந்தத்தில் ஒப்புக்கொண்டது. படலம் மெதுவாக ஆறி வருகிறது.'}},
 {c:{en:'Do not mix it up with global warming. The ozone hole is about UV rays. Global warming is about trapped heat.',ta:'இதைப் புவி வெப்பமாதலுடன் குழப்பிக்கொள்ளாதீர்கள். ஓசோன் துளை புற ஊதாக் கதிர்கள் பற்றியது. புவி வெப்பமாதல் சிறைப்பட்ட வெப்பம் பற்றியது.'}}],

CLIPS.carbon={bg:'day',look:{en:'Where the carbon dioxide arrows enter, and where they leave.',ta:'கார்பன் டை ஆக்சைடு அம்புகள் எங்கே நுழைகின்றன, எங்கே வெளியேறுகின்றன என்று பாருங்கள்.'},
 steps:[
 {c:{en:'Carbon is always moving between the air, plants, soil and oceans. This is the carbon cycle.',ta:'கார்பன் எப்போதும் காற்று, தாவரங்கள், மண், கடல்களுக்கு இடையே நகர்கிறது. இதுவே கார்பன் சுழற்சி.'}},
 {c:{en:'Plants take in carbon dioxide from the air to grow (photosynthesis) and give out oxygen.',ta:'தாவரங்கள் வளர காற்றிலிருந்து கார்பன் டையாக்சைடை எடுத்து (ஒளிச்சேர்க்கை) ஆக்சிஜனை வெளியிடுகின்றன.'}},
 {c:{en:'The oceans also dissolve carbon dioxide from the air.',ta:'கடல்களும் காற்றிலிருந்து கார்பன் டையாக்சைடைக் கரைத்துக்கொள்கின்றன.'}},
 {c:{en:'Burning coal, oil and gas releases carbon that was stored underground for millions of years, much faster than nature can absorb it.',ta:'நிலக்கரி, எண்ணெய், வாயுவை எரிப்பது இலட்சக்கணக்கான ஆண்டுகளாக நிலத்தடியில் சேமிக்கப்பட்ட கார்பனை, இயற்கை உறிஞ்சுவதைவிட மிக வேகமாக வெளியிடுகிறது.'}},
 {c:{en:'Land and oceans absorb about half of our emissions. The rest stays in the air. The CO₂ in the sea also makes it more acidic.',ta:'நிலமும் கடலும் நம் உமிழ்வில் ஏறக்குறைய பாதியை உறிஞ்சுகின்றன. மீதி காற்றிலேயே தங்குகிறது. கடலிலுள்ள CO₂ அதை அதிக அமிலமாகவும் ஆக்குகிறது.'}},
 {c:{en:'Protecting forests, mangroves and wetlands keeps carbon locked up, and protects people from floods and heat too.',ta:'காடுகள், அலையாத்திக் காடுகள், ஈரநிலங்களைப் பாதுகாப்பது கார்பனைப் பூட்டி வைப்பதுடன் வெள்ளம், வெப்பத்திலிருந்தும் மக்களைக் காக்கிறது.'}}],

function aggregate(recs,qi,keyOf,keys){
  return keys.map(k=>{const c=[0,0,0,0,0];let n=0,sum=0,sq=0;
    recs.forEach(r=>{if(keyOf(r)!==k.v)return;const ch=r.a[qi];if(ch==='0')return;const v=+ch-3;c[v+2]++;n++;sum+=v;sq+=v*v});
    const mean=n?sum/n:null,sd=n>1?Math.sqrt(Math.max(0,sq/n-mean*mean)):null;
    return{label:k.label,c,n,mean,agree:sd==null?null:1-sd/2};});
}

  const nextP=PRED.find(p=>!S.pred[p.id]);
  PRED.forEach(p=>{
    const a=S.pred[p.id];
    if(a){w.append(h('section',{class:'card'},h('h3',{lang:lang()},L(p.q)),
      h('p',{},h('span',{class:'chip '+(a.hit?'v-consistent':'v-confounded')},a.hit?(lang()==='ta'?'சரி':'In range'):(lang()==='ta'?'தவறு':'Outside range')),' ',(lang()==='ta'?'உங்கள் ஊகம் ':'You said ')+fmtv(p,a.g)+' · '+t('c'+a.c).replace(t('c1'),lang()==='ta'?'ஊகம் மட்டும்':'Guessing').replace(t('c3'),lang()==='ta'?'முழு உறுதி':'Certain')),
      h('p',{},h('b',{},p.truth)),P(p.why,null,'p',{class:'muted'})));return}
    if(p!==nextP)return;
    const d=draft[p.id]||(draft[p.id]={g:p.init,c:0});

    rg.addEventListener('input',()=>{d.g=+rg.value;out.textContent=fmtv(p,d.g)});
    const seg=h('div',{class:'seg',role:'group','aria-label':lang()==='ta'?'எவ்வளவு உறுதி?':'How sure are you?'});
    [[1,{en:'Guessing',ta:'ஊகம் மட்டும்'}],[2,{en:'Fairly sure',ta:'ஓரளவு உறுதி'}],[3,{en:'Certain',ta:'முழு உறுதி'}]].forEach(([c,l])=>seg.append(h('button',{type:'button','aria-pressed':d.c===c?'true':'false',onclick:()=>{d.c=c;render('#lock')}},L(l))));
    w.append(h('section',{class:'card'},h('div',{class:'muted'},(PRED.indexOf(p)+1)+' / '+PRED.length),h('h2',{lang:lang()},L(p.q)),out,rg,h('label',{},lang()==='ta'?'எவ்வளவு உறுதி?':'How sure are you?'),seg,
      h('div',{class:'row',style:'margin-top:14px'},h('button',{class:'btn',type:'button',id:'lock',disabled:d.c?null:true,onclick:()=>{S.pred[p.id]={g:d.g,c:d.c,hit:d.g>=p.lo&&d.g<=p.hi};delete draft[p.id];save();render()}},lang()==='ta'?'பூட்டி விடையைப் பார்':'Lock in and reveal'))));
  });
  const ans=PRED.filter(p=>S.pred[p.id]);
  if(ans.length>=3){
    const lv=[3,2,1].map(c=>{const x=ans.filter(p=>S.pred[p.id].c===c);return{c,n:x.length,k:x.filter(p=>S.pred[p.id].hit).length}});
    const sure=lv[0],msg=(sure.n>=2&&sure.k/sure.n<0.6)?['Your “certain” answers were right less than 60% of the time. That is overconfidence, and nearly everyone shows it. Confidence is a feeling, not a measurement.','உங்கள் “முழு உறுதி” பதில்களில் 60%-க்கும் குறைவே சரி. இது அதீத நம்பிக்கை; கிட்டத்தட்ட அனைவருக்கும் இது உண்டு. நம்பிக்கை ஒரு உணர்வு; அளவீடு அல்ல.']:(sure.n>=2&&sure.k===sure.n)?['Every answer you were certain about held up. With so few questions, treat that as a good sign, not a settled fact.','நீங்கள் முழு உறுதி என்ற ஒவ்வொரு பதிலும் சரியாக இருந்தது. இவ்வளவு குறைந்த கேள்விகளில் இதை நல்ல அறிகுறியாக மட்டும் கொள்ளுங்கள்.']:['Keep going: calibration needs a few confident answers to judge. Try committing to “certain” when you truly are.','தொடருங்கள்: அளவீட்டை மதிப்பிட சில உறுதியான பதில்கள் தேவை. உண்மையிலேயே உறுதியாக இருக்கும்போது “முழு உறுதி” எனத் தேர்ந்தெடுங்கள்.'];
    w.append(h('section',{class:'card'},h('h2',{lang:lang()},lang()==='ta'?'உங்கள் அளவீடு':'Your calibration'),
      lv.map(x=>h('div',{class:'gl'},h('span',{},L([,{en:'Guessing',ta:'ஊகம்'},{en:'Fairly sure',ta:'ஓரளவு'},{en:'Certain',ta:'முழு உறுதி'}][x.c])),h('div',{class:'bar','aria-hidden':'true'},x.n?h('i',{style:'width:'+(x.k/x.n*100)+'%;background:var(--sea)'}):null),h('span',{class:'muted'},x.k+' / '+x.n))),P(msg[0],msg[1])));
  }
  if(!nextP)w.append(h('div',{class:'row'},h('button',{class:'btn ghost',type:'button',onclick:()=>{S.pred={};save();render()}},lang()==='ta'?'மீண்டும் முயல்':'Try again')));
  w.append(foot());return w;
}

/* ===== boot ===== */
function boot(){
  load();
  $('#zoomBtn').addEventListener('click',()=>{S.zoom=((S.zoom||0)+1)%3;save();chrome()});
  try{window.speechSynthesis&&window.speechSynthesis.addEventListener&&window.speechSynthesis.addEventListener('voiceschanged',loadVoices);loadVoices()}catch(e){}
  $('#langBtn').addEventListener('click',()=>{S.lang=S.lang==='ta'?'en':'ta';save();render()});
  $('#themeBtn').addEventListener('click',()=>{S.theme=S.theme==='dark'?'light':'dark';save();chrome()});
  render();
}
boot();
})();
</script>
