name: Vendor pinned subset fonts

on:
  push:
    branches: [native-v2]
    paths:
      - tools/vendor_fonts.py
      - .github/workflows/vendor-fonts.yml

permissions:
  contents: write

jobs:
  vendor-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out native-v2
        uses: actions/checkout@v5
        with:
          ref: native-v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned FontTools
        run: python -m pip install --disable-pip-version-check fonttools==4.60.1

      - name: Generate pinned static subsets
        run: python tools/vendor_fonts.py

      - name: Commit generated OFL font assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/font/*_subset.ttf docs/licenses/OFL-Noto-Latin.txt docs/licenses/OFL-Noto-Tamil.txt
          if git diff --cached --quiet; then
            echo "FONT_VENDOR_NO_CHANGE"
          else
            git commit -m "assets: vendor pinned subset Noto fonts"
            git push origin HEAD:native-v2
          fi
