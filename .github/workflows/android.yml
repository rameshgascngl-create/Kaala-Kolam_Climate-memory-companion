name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run static QA
        run: python3 scripts/static_qa.py

      - name: Lint debug
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Assert packaged APK requests no permissions
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n1)"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$AAPT2" dump permissions "$APK" | tee apk-permissions.txt
          if grep -q '^uses-permission:' apk-permissions.txt; then
            echo "FAIL: packaged APK requests a permission" >&2
            exit 1
          fi
          echo "PASS: packaged APK requests no permissions"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KaalaKolam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: KaalaKolam-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: error

      - name: Upload APK permission evidence
        uses: actions/upload-artifact@v4
        with:
          name: KaalaKolam-apk-permissions
          path: apk-permissions.txt
          if-no-files-found: error
