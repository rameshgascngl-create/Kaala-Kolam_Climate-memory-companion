name: Native Android CI

on:
  push:
    branches: [native-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify generated content policy
        run: python3 tools/test_content_asset.py

      - name: Run native static QA
        run: python3 tools/native_static_qa.py

      - name: Lint, unit test, and assemble debug
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Assert merged manifest requests no permissions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find app/build/intermediates -type f -name AndroidManifest.xml | grep -E '/(merged_manifest|merged_manifests)/' | sort)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No merged debug manifest was produced" >&2
            exit 1
          fi
          chosen=""
          for candidate in "${manifests[@]}"; do
            if [[ "$candidate" == *"/debug/"* || "$candidate" == *"Debug"* ]]; then
              chosen="$candidate"
              break
            fi
          done
          if [ -z "$chosen" ]; then
            chosen="${manifests[0]}"
          fi
          echo "Merged manifest: $chosen"
          python3 tools/assert_merged_manifest.py "$chosen"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KaalaKolam-native-v2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: KaalaKolam-native-v2-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: error

      - name: Upload unit-test reports
        uses: actions/upload-artifact@v4
        with:
          name: KaalaKolam-native-v2-unit-tests
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
