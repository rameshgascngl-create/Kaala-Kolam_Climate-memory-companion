name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify HTML delta
        run: python3 scripts/verify_html_delta.py

      - name: Assert no network or file URL capability
        shell: bash
        run: |
          if grep -R -n -E 'android.permission|INTERNET|file://' app/src; then
            echo 'Forbidden permission or file URL marker found.' >&2
            exit 1
          fi

      - name: Lint debug
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Assert APK declares no permissions
        shell: bash
        run: |
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n1)"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$AAPT2" dump permissions "$APK" | tee apk-permissions.txt
          if grep -q 'uses-permission' apk-permissions.txt; then
            echo 'APK declares at least one permission.' >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KaalaKolam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: KaalaKolam-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: error
