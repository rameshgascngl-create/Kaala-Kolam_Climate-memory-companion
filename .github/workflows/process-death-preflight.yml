name: Elders Process-Death Preflight

on:
  push:
    branches:
      - 'diag/elders-process-death-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-death-preflight:
    name: API 34 Elders process-death preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK only
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run isolated API 34 Elders process-death prerequisite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/emulator_elder_resume.sh

      - name: Upload process-death preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaalaKolam-elders-process-death-preflight-evidence
          path: app/build/emulator-evidence/
          if-no-files-found: warn
