name: Release bundle

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify HTML delta
        run: python3 scripts/verify_html_delta.py

      - name: Restore release keystore when configured
        if: ${{ secrets.KK_KEYSTORE_BASE64 != '' && secrets.KK_STORE_PASSWORD != '' && secrets.KK_KEY_ALIAS != '' && secrets.KK_KEY_PASSWORD != '' }}
        shell: bash
        env:
          KK_KEYSTORE_BASE64: ${{ secrets.KK_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kaalakolam-release.jks"
          chmod 600 "$RUNNER_TEMP/kaalakolam-release.jks"

      - name: Build release bundle
        shell: bash
        env:
          KK_STORE_FILE: ${{ runner.temp }}/kaalakolam-release.jks
          KK_STORE_PASSWORD: ${{ secrets.KK_STORE_PASSWORD }}
          KK_KEY_ALIAS: ${{ secrets.KK_KEY_ALIAS }}
          KK_KEY_PASSWORD: ${{ secrets.KK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: KaalaKolam-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
