name: Signed release bundle

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    if: >-
      ${{ secrets.KK_KEYSTORE_BASE64 != '' &&
          secrets.KK_STORE_PASSWORD != '' &&
          secrets.KK_KEY_ALIAS != '' &&
          secrets.KK_KEY_PASSWORD != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        shell: bash
        env:
          KK_KEYSTORE_BASE64: ${{ secrets.KK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          key_path="$RUNNER_TEMP/kaalakolam-release.jks"
          printf '%s' "$KK_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "KK_STORE_FILE=$key_path" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        env:
          KK_STORE_PASSWORD: ${{ secrets.KK_STORE_PASSWORD }}
          KK_KEY_ALIAS: ${{ secrets.KK_KEY_ALIAS }}
          KK_KEY_PASSWORD: ${{ secrets.KK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lintRelease bundleRelease

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: KaalaKolam-native-v2-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
