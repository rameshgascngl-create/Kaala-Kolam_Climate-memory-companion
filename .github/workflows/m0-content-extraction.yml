name: M0 content extraction

on:
  push:
    branches: [native-v2]

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out native-v2
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Obtain and verify audited HTML source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin correction-v1-1:refs/remotes/origin/correction-v1-1
          git show origin/correction-v1-1:Kaala_Kolam_Climate_Memory_Companion.html > /tmp/Kaala_Kolam_Climate_Memory_Companion.html
          test "$(wc -c < /tmp/Kaala_Kolam_Climate_Memory_Companion.html)" -eq 361881
          printf '%s  %s\n'             'ae7b87a4f90fd990806f68cf6db1d3a0903d9cf6b5ef75c9be2c5392e66508a9'             '/tmp/Kaala_Kolam_Climate_Memory_Companion.html' | sha256sum -c -

      - name: Install extraction-only Playwright
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.57.0'
          python -m playwright install --with-deps chromium

      - name: Extract native content assets
        run: |
          python tools/extract_content.py             /tmp/Kaala_Kolam_Climate_Memory_Companion.html             app/src/main/assets/content             --source-label 'v1.0 audited HTML; correction-v1-1 has no corrected v1.1 content commit as of M0'             --expected-sha256 ae7b87a4f90fd990806f68cf6db1d3a0903d9cf6b5ef75c9be2c5392e66508a9

      - name: Verify extracted content
        run: |
          python tools/test_content_asset.py
          sha256sum app/src/main/assets/content/*.json

      - name: Commit deterministic M0 assets and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/m0-content-extraction.yml
          git add app/src/main/assets/content .github/workflows/m0-content-extraction.yml
          git diff --cached --check
          git status --short
          git commit -m 'M0: commit extracted native content assets'
          git push origin HEAD:native-v2
