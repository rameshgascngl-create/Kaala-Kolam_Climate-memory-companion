name: Reference Capture Preflight

on:
  push:
    branches:
      - 'diag/reference-preflight-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tamil-reference-preflight:
    name: Tamil reference preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Capture Tamil localisation golden matrix
        run: python3 tools/capture_tamil_golden.py

      - name: Upload Tamil preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KaalaKolam-reference-preflight-tamil
          path: tests/golden-tamil
          if-no-files-found: error
